# Chapter 16: HIR

## What HIR is for

HIR is the first representation that is both **fully resolved** and **fully
typed**. It is still shaped like source — there are still `if` statements and
blocks and nested expressions — but every name is an ID and every expression has
a type.

```rust
// src/hir/mod.rs
//! Typed high-level intermediate representation.
//!
//! HIR contains resolved identities and semantic `TypeId`s only. It never
//! embeds syntax AST nodes or unresolved source names.
```

That doc comment is the invariant. HIR is where the front end's promises are
cashed in.

## AST versus HIR

Set the two side by side:

```mermaid
flowchart TD
    subgraph AST["syntax::ast::Expr"]
        A1["kind: Field {<br/>&nbsp;&nbsp;receiver: Expr,<br/>&nbsp;&nbsp;name: <b>String</b><br/>}"]
        A2["<i>no type</i>"]
    end

    subgraph HIR["hir::Expr"]
        H1["kind: Field {<br/>&nbsp;&nbsp;receiver: Expr,<br/>&nbsp;&nbsp;field: <b>FieldId</b><br/>}"]
        H2["ty: <b>TypeId</b>"]
    end

    AST ==>|"hir::lower"| HIR

    style AST fill:#EAF3F7,stroke:#1F6F8B
    style HIR fill:#E9F8F1,stroke:#40C98A
```

```rust
// src/hir/mod.rs
pub struct Expr {
    pub source: NodeId,   // where in the AST this came from
    pub span: Span,       // where in the source
    pub ty: TypeId,       // what type it is
    pub kind: ExprKind,
}
```

Three pieces of metadata on every expression. `source` and `span` are what let a
diagnostic raised in MIR lowering still point at the user's code.

## Dispatch is decided here

The single most valuable thing HIR does is resolve method calls:

```rust
// src/hir/mod.rs
pub enum MethodTarget {
    Definition(DefId),                     // static dispatch — call this function
    Dynamic { owner: TypeId, method: DefId }, // dynamic dispatch — vtable lookup
    Intrinsic { owner: TypeId, name: String }, // compiler-provided
}

pub enum StaticTarget {
    Definition(DefId),
    Variant(VariantId),                    // enum constructor
    Intrinsic { owner: TypeId, name: String },
}
```

By the time something is HIR, `counter.bump(1)` is not "look up `bump`" — it is
`MethodTarget::Definition(DefId(2))`. The decision between static and dynamic
dispatch has already been made and recorded.

This is why the backend never performs method lookup. It cannot get dispatch
wrong, because it is not asked to make the choice.

## Field access versus length

A small detail that shows the value of an explicit IR:

```rust
// src/hir/mod.rs
Field { receiver: Box<Expr>, field: FieldId },
Length { receiver: Box<Expr> },
```

In source, `xs.len` and `point.x` look identical — both are `.` followed by a
name. In HIR they are different node kinds, because `len` on an array is not a
field lookup; it is a distinct operation with distinct lowering. Resolving that
ambiguity once, here, means MIR and the backend never re-derive it.

## Flow

```rust
// src/hir/mod.rs
pub enum Flow { FallsThrough, Returns, Diverges }

pub struct Block {
    pub source: NodeId,
    pub span: Span,
    pub statements: Vec<Stmt>,
    pub flow: Flow,
}
```

Every block records whether control can reach its end. `If`, `Match`, and `For`
carry it too. MIR lowering reads this to decide whether to emit an edge out of a
construct, and the checker uses it for "missing return statement".

## Our example in HIR

```text
Item { kind: Struct(Struct {
    fields:  [ Field { id: FieldId(0), name: "value", ty: TypeId(4)/*int*/ } ],
    methods: [ Function new, Function bump ],
})}

Item { kind: Function(Function {          // main
    definition: Some(DefId(3)),
    result: TypeId(2)/*void*/,
    body: Block {
        flow: FallsThrough,
        statements: [
            Stmt::Local {
                local: LocalId(0),
                ty: TypeId(14)/*Counter*/,
                initializer: Some(Expr {
                    ty: TypeId(14),
                    kind: StaticCall {
                        target: StaticTarget::Definition(DefId(1)),   // Counter::new
                        arguments: [ Expr { ty: TypeId(4), kind: Literal(Integer(41)) } ],
                    },
                }),
            },
            Stmt::Print(Expr {
                ty: TypeId(4)/*int*/,
                kind: MethodCall {
                    receiver: Expr { ty: TypeId(14), kind: Value(Local(LocalId(0))) },
                    method: MethodTarget::Definition(DefId(2)),        // Counter::bump
                    argument_groups: [[ Expr { ty: TypeId(4), kind: Literal(Integer(1)) } ]],
                },
            }),
        ],
    },
})}
```

Every name is gone. Every expression has a type. Dispatch is decided.

# Chapter 17: HIR Validation and Sealing

## Two gates before the middle end

```mermaid
flowchart LR
    H["hir::Module"]
    V["<b>hir::validate</b><br/><i>Are the IDs sane?</i>"]
    S["<b>specialization::seal</b><br/><i>Is everything concrete?</i>"]
    M["Ready for MIR"]

    H --> V --> S --> M

    style V fill:#EAF3F7,stroke:#1F6F8B
    style S fill:#EAF3F7,stroke:#1F6F8B
    style M fill:#E9F8F1,stroke:#40C98A
```

## Validation

```rust
// src/hir/validate.rs
//! Structural invariants for the typed HIR boundary.
//!
//! HIR is the last source-oriented representation. Code generation may rely on
//! these invariants instead of repeating bounds checks or accepting sentinel
//! IDs left behind by an incomplete lowering rule.
```

The validator walks the whole tree and checks that every ID actually points at
something: `FieldId`s exist in the model, `TypeId`s are in range, `LocalId`s were
declared, spans are well-formed.

This might look like paranoia — surely lowering produced valid IDs? The point is
that it converts a *class* of bug into an immediate, localised failure. Without
it, an incorrect `FieldId` from a buggy lowering rule surfaces as a
`HashMap` miss in the backend, or worse, as silently wrong generated code. With
it, you get a diagnostic naming the construct.

This is a pattern worth adopting when you add an IR: write the validator at the
same time as the data structure.

## Sealing

```rust
// src/specialization/mod.rs
//! Verifies and records the concrete program produced by generic expansion.
//!
//! Generic discovery happens before HIR. This phase is the stable post-HIR
//! contract: every runtime declaration and local type must be concrete before
//! code generation.

pub fn seal(
    module: &hir::Module,
    model: &SemanticModel,
) -> Result<SpecializationSet, Vec<Diagnostic>> { /* ... */ }
```

Sealing is the *proof* that Chapter 12's contract held. It walks every
declaration and every local type, and verifies none of them still mentions a
`TypeKind::GenericParameter`.

The architectural value is the separation of concerns. Expansion runs early, on
an untyped string tree, with poor diagnostics. Sealing runs late, on typed HIR,
with real spans. If expansion misses an instantiation, the failure is reported
here — with a location — instead of becoming a mysterious backend crash.

The output records what must exist at runtime:

```rust
// src/specialization/mod.rs
pub struct SpecializationSet {
    pub definitions: Vec<DefId>,
    pub types: Vec<TypeId>,
}
```

Both vectors are sorted and deduplicated, which keeps downstream iteration
deterministic — the same concern that shaped expansion in Chapter 11.

# Chapter 18: Why MIR Exists

## What HIR still hides

HIR is typed and resolved, but it is still *shaped like source*, and source shape
hides three things the machine needs.

**Evaluation order.** `f(a) + g(b)` does not say whether `f` runs first.

**Storage.** Where does the result of `f(a)` live while `g(b)` runs?

**Control flow.** An `if` with an `else` inside a `for` with an early `return` is
a nest of Rust enums. A CPU sees only conditional jumps.

MIR makes all three explicit.

```rust
// src/mir/mod.rs
//! Typed, control-flow-oriented mid-level intermediate representation.
//!
//! HIR preserves structured language constructs. MIR makes evaluation order,
//! temporary values, and control-flow edges explicit before LLVM lowering.
//! It is deliberately non-SSA: the LLVM backend remains responsible for SSA
//! temporaries while MIR provides a small, typed contract independent of LLVM.
```

That last sentence is a real design decision, stated plainly. Full SSA
construction is work; LLVM already does it well. MIR stops one level short and
lets LLVM finish.

## Basic blocks

A **basic block** is a straight-line sequence of statements with exactly one
entry at the top and exactly one terminator at the bottom. No jumps in the
middle, no falling off the end.

```rust
// src/mir/mod.rs
pub struct BasicBlock {
    pub id: MirBlockId,
    pub statements: Vec<Statement>,
    pub terminator: Terminator,
}

pub enum TerminatorKind {
    Goto { target: MirBlockId },
    If { condition: Operand, then_target: MirBlockId, else_target: MirBlockId },
    SwitchEnum {
        discriminator: Operand,
        targets: Vec<(VariantId, MirBlockId)>,
        otherwise: MirBlockId,
    },
    Return(Option<Operand>),
    Unreachable,
}
```

A function is then a *graph*: blocks as nodes, terminators as edges.

Here is what a `for` loop becomes:

```mermaid
flowchart TD
    ENTRY["<b>bb0 — entry</b><br/>i = 0<br/>goto bb1"]
    COND["<b>bb1 — condition</b><br/>t0 = i &lt; 10<br/>if t0 → bb2 else bb4"]
    BODY["<b>bb2 — body</b><br/>print(i)<br/>goto bb3"]
    UPDATE["<b>bb3 — update</b><br/>i = i + 1<br/>goto bb1"]
    EXIT["<b>bb4 — exit</b><br/>return"]

    ENTRY --> COND
    COND -->|true| BODY
    COND -->|false| EXIT
    BODY --> UPDATE
    UPDATE --> COND

    style ENTRY fill:#E9F8F1,stroke:#40C98A
    style EXIT fill:#EAF3F7,stroke:#1F6F8B
```

The nesting is gone. The loop is a cycle in a graph. This is exactly the shape
`lower_for` builds — go back and read it in `src/mir/lower/control_flow.rs` now
that the picture is in your head; it allocates precisely these four blocks.

## Places, operands, rvalues

MIR draws a three-way distinction that is worth internalising, because it removes
a whole category of confusion.

```mermaid
flowchart TD
    P["<b>Place</b><br/><i>a location you can address</i><br/><code>counter.value</code><br/><code>xs[3]</code><br/><code>*ptr</code>"]
    O["<b>Operand</b><br/><i>a value you can consume</i><br/><code>copy counter.value</code><br/><code>const 41</code>"]
    R["<b>Rvalue</b><br/><i>a computation producing a value</i><br/><code>a + b</code><br/><code>&amp;mut x</code><br/><code>Counter { value: 41 }</code>"]

    P -->|"Copy(place)"| O
    O -->|"used in"| R
    R -->|"assigned to"| P

    style P fill:#EAF3F7,stroke:#1F6F8B
    style R fill:#E9F8F1,stroke:#40C98A
```

```rust
// src/mir/mod.rs
pub struct Place {
    pub base: PlaceBase,
    pub projections: Vec<Projection>,
}

pub enum PlaceBase {
    Local(MirLocalId),
    Definition(DefId),      // a global
}

pub enum ProjectionKind {
    Dereference,
    Field(FieldId),
    Index(Vec<Operand>),
    VariantField { variant: VariantId, index: u32 },
}
```

A place is a base plus projections. `(*p).items[i].x` is: base `p`, then
`Dereference`, then `Field(items)`, then `Index([i])`, then `Field(x)`.

Crucially, each projection records the type *after* it is applied:

```rust
pub struct Projection {
    /// The type of the place immediately after this projection is applied.
    pub ty: TypeId,
    pub kind: ProjectionKind,
}
```

So the backend computing an address never has to re-derive intermediate types. It
walks the projections and the types are handed to it. That is a lot of potential
bugs designed away.

## Calls carry their dispatch

```rust
// src/mir/mod.rs
/// A resolved call site. Dispatch remains explicit so code generation never
/// has to repeat method lookup or distinguish enum constructors by name.
pub enum CallTarget {
    Operand(Operand),                                   // calling a function value
    Method { receiver: Operand, method: MethodCallee },
    Static(StaticCallee),
}
```

The comment says it: code generation never repeats method lookup. Dispatch was
decided in HIR and is carried forward verbatim.

## Explicit coercion

```rust
// src/mir/mod.rs
pub enum RvalueKind {
    Use(Operand),
    /// A semantic conversion approved by the front end. Keeping it explicit
    /// prevents code generation from guessing at assignment boundaries.
    Coerce(Operand),
    // ...
}
```

Assigning an `int` to a `long`, or a `*Counter` to a `Writer` trait object,
requires a representation change. `Coerce` marks exactly where. Without it, the
backend would have to compare source and destination types at every assignment
and guess whether a conversion was intended — and a guess that differs from the
front end's is a miscompilation.

# Chapter 19: MIR Lowering

## The shape of the code

```rust
// src/mir/lower/mod.rs
pub fn lower(module: &hir::Module, model: &SemanticModel) -> Result<Module, Vec<Diagnostic>> {
    let mut functions = Vec::new();
    let mut diagnostics = Vec::new();
    let declarations = declaration::lower_module(module, model, &mut functions, &mut diagnostics);

    if diagnostics.is_empty() {
        Ok(Module { declarations, functions })
    } else {
        Err(diagnostics)
    }
}
```

Split across four modules by concern:

| Module | Responsibility |
|---|---|
| `declaration.rs` | Types, globals, extern functions; collecting function bodies |
| `expression.rs` | Expressions → operands and rvalues, allocating temporaries |
| `control_flow.rs` | `if`, `match`, `for` → blocks and terminators |
| `captures.rs` | Closure environments |

## Building blocks incrementally

The lowerer needs to create a block before it knows the block's terminator — you
emit the body of an `if` before you know where control goes afterwards. So blocks
are built in draft form:

```rust
// src/mir/lower/mod.rs
struct DraftBlock {
    id: MirBlockId,
    statements: Vec<Statement>,
    terminator: Option<Terminator>,   // filled in later
    reachable: bool,
}
```

`terminator: Option<_>` is the incremental part; `reachable` tracks dead code
after a `return`.

Read `lower_for` with this in mind:

```rust
// src/mir/lower/control_flow.rs — abridged
pub(super) fn lower_for(&mut self, loop_statement: &'a hir::For, source: NodeId, span: Span) {
    if let Some(initializer) = loop_statement.initializer.as_deref() {
        self.lower_statement(initializer);
    }
    if !self.current_is_open_and_reachable() { return; }

    let Some(condition_target) = self.new_block(span) else { return; };
    let Some(body_target)      = self.new_block(loop_statement.body.span) else { return; };
    let Some(update_target)    = self.new_block(span) else { return; };
    let Some(exit_target)      = self.new_block(span) else { return; };

    self.terminate(Terminator { source, span,
        kind: TerminatorKind::Goto { target: condition_target } });

    self.current = condition_target;
    if let Some(condition) = &loop_statement.condition {
        let Some(condition) = self.lower_expression(condition) else { return; };
        self.terminate(Terminator { source, span, kind: TerminatorKind::If {
            condition, then_target: body_target, else_target: exit_target } });
    } else {
        self.terminate(Terminator { source, span,
            kind: TerminatorKind::Goto { target: body_target } });
    }

    self.current = body_target;
    self.lower_block(&loop_statement.body);
    self.goto_if_open(update_target, source, span);
    // ...
}
```

Four blocks allocated up front, then filled. `self.current` is the cursor.
`goto_if_open` only emits an edge if the block has not already been terminated —
which is how a `return` inside a loop body does not produce unreachable
fall-through.

The `let Some(..) = .. else { return; }` pattern appears constantly: an error was
already recorded as a diagnostic, so lowering abandons this construct and
continues elsewhere, collecting more errors rather than stopping at the first.

## Temporaries

```rust
// src/mir/mod.rs
pub enum LocalKind { Capture, Parameter, User, Temporary }

pub struct Local {
    pub id: MirLocalId,
    pub source: Option<LocalId>,   // None for temporaries
    pub ty: TypeId,
    pub mutable: bool,
    pub kind: LocalKind,
}
```

`self.value + amount` needs somewhere to put the sum. Lowering allocates a
`Temporary` local, assigns the `Binary` rvalue into it, and uses it as an
operand.

`source: Option<LocalId>` is the link back to the user's variable, present for
`User` and `Parameter` locals and absent for temporaries. That is what would let
a future debugger map a MIR slot to a name.

## Closures

```rust
// src/mir/mod.rs
pub enum RvalueKind {
    Closure { function: NodeId, captures: Vec<Place> },
    // ...
}

pub struct Function {
    pub captures: Vec<MirLocalId>,   // environment, in field order
    pub parameters: Vec<MirLocalId>,
    // ...
}
```

A closure becomes two things: a separate `Function` whose `captures` are extra
leading locals, and a `Closure` rvalue at the creation site listing the places to
capture from. The backend turns that into a `{ ptr, ptr }` pair — code pointer
plus environment pointer — which is why `LlvmType::Function` lowers to exactly
that shape.

## Our example in MIR

```text
fn skunk_Counter_bump(_0: *Counter, _1: int) -> int {
    let _2: int;                     // Temporary
    bb0:
        _2 = Binary {
            left:     Copy((*_0).value),
            operator: Add,
            right:    Copy(_1),
        }
        Assign { destination: (*_0).value, value: Use(Copy(_2)) }
        Return(Some(Copy((*_0).value)))
}

fn skunk_main() -> void {
    let _0: Counter;                 // User    — `counter`
    let _1: int;                     // Temporary
    bb0:
        Call {
            destination: Some(_0),
            target: Static(Definition(DefId(1))),      // Counter::new
            argument_groups: [[ Constant(Literal(Integer(41))) ]],
        }
        Call {
            destination: Some(_1),
            target: Method {
                receiver: Copy(_0),
                method:   Definition(DefId(2)),        // Counter::bump
            },
            argument_groups: [[ Constant(Literal(Integer(1))) ]],
        }
        Print(Copy(_1))
        Return(None)
}
```

Every intermediate has a slot. Evaluation order is a statement sequence. Control
flow is explicit.

# Chapter 20: MIR Validation

## The contract with the backend

```rust
// src/mir/validate/mod.rs
//! Structural and typing invariants for MIR.
//!
//! LLVM lowering may rely on these checks: IDs are in range, every block has
//! one terminator, control-flow targets exist, projected places are well typed,
//! aggregates and calls match their semantic shapes, conditions are boolean,
//! and return values match their function signature.
```

That comment is a list of things the backend is entitled to assume. Every item is
one fewer defensive check in code generation.

## What is checked

| Check | Why it matters |
|---|---|
| Local and block IDs are in range | An out-of-range index would panic in the backend |
| Every block has exactly one terminator | A block that falls off the end has no meaning |
| Branch targets exist | A dangling `MirBlockId` is a broken CFG |
| Projections are type-correct | `Field(f)` on a non-struct is nonsense |
| Aggregates match their declarations | Struct literals must supply the declared fields |
| Call arguments match signatures | Wrong arity would produce invalid LLVM |
| `If` conditions are boolean | LLVM's `br` needs an `i1` |
| Returns match the function result | Otherwise the ABI breaks |

## Why validate what you just built

Lowering produced this MIR; surely it is correct?

The argument is the same as for HIR validation, and it is about *where failures
surface*. A wrong `FieldId` from a new lowering rule, unchecked, becomes a
`HashMap` miss deep in `mir_codegen`, or invalid LLVM IR that `clang` rejects
with a message about a construct the Skunk programmer never wrote. Validated, it
becomes a diagnostic naming the construct, with a span.

Validation is also *executable documentation*. The clearest statement of MIR's
invariants is the validator, and if you are unsure whether some MIR shape is
legal, reading `src/mir/validate/` answers it faster than any prose.

## In practice

When you add a MIR construct:

1. Add the variant.
2. Add its lowering rule.
3. **Add its validation rule.**
4. Add backend support.

Skipping step 3 is the most common way to introduce a bug that takes a day to
find. The validator is split into `declaration.rs`, `value.rs`, and
`coercion.rs`, mirroring the lowering modules, so there is an obvious home for
each new rule.

# Chapter 21: Just Enough LLVM

## What LLVM is

LLVM is a compiler back end you can hand a program to. You give it LLVM IR — a
typed, portable, assembly-like language — and it gives you optimised machine code
for whatever CPU you asked for.

This is an enormous amount of work you do not have to do: instruction selection,
register allocation, scheduling, peephole optimisation, and a separate backend
per architecture. Skunk's entire backend is about 3,600 lines because LLVM
handles all of that.

## Skunk emits IR as text

There are two ways to produce LLVM IR: call the LLVM C API through bindings like
`inkwell`, or write out the textual form and hand it to `clang`.

Skunk writes text.

```rust
// src/backend/emitter.rs
self.emit_line(format!(
    "call i32 (ptr, ...) @printf(ptr {}, i32 {})",
    self.string_ptr(&format),
    value.value
));
```

That is `format!` producing a line of LLVM assembly, appended to a buffer.

**The upside** is no native dependency, no version-matching against a system
LLVM, trivially inspectable output, and a much simpler build. For a language
experiment this is a very reasonable trade.

**The downside** is that mistakes are caught by `clang` at parse time rather than
by a type-checked builder API, and the error points at generated text rather than
at the code that generated it.

> **⚠ Seam.** Emitting text also means there is no abstraction boundary to
> substitute a different backend behind. Adding a second target — Cranelift,
> WebAssembly — would mean rewriting `backend/` rather than implementing an
> interface. Chapter 29 discusses this.

## The IR you need to read

Enough to follow `emitter.rs`.

**Types.** `i1` (bool), `i8`, `i16`, `i32`, `i64`, `float`, `double`, `ptr` (an
opaque pointer — modern LLVM does not type pointers), `{ ... }` (a struct),
`[N x T]` (an array).

**Values.** `%name` is local to a function, `@name` is global. `%0`, `%1` are
unnamed temporaries.

**SSA.** Every value is assigned exactly once. That is why the emitter has a
`temp_counter` and hands out a fresh `%N` for each intermediate — you cannot
overwrite one.

**Memory.** `alloca` reserves stack space and yields a pointer. `store` writes,
`load` reads. Skunk gives every local an `alloca` and lets LLVM's `mem2reg` pass
promote them into registers, which is the standard approach — it means the
front end never has to construct SSA φ-nodes itself.

**Control.** `br label %target` jumps; `br i1 %c, label %a, label %b` branches.
Blocks are named by labels. This maps almost one-to-one onto MIR terminators,
which is not a coincidence.

**Calls.** `call i32 @f(i32 %x)`.

**Addresses.** `getelementptr` computes a field or element address without
loading it. You will see it constantly in `place.rs`, because it is exactly what
a MIR `Place` projection lowers to.

A short worked example — Skunk on the left, IR on the right in spirit:

```llvm
; function bump(mut self, amount: int): int
define i32 @skunk_Counter_bump(ptr %self, i32 %amount) {
entry:
  %value.ptr = getelementptr inbounds %struct.Counter, ptr %self, i32 0, i32 0
  %old       = load i32, ptr %value.ptr
  %sum       = add i32 %old, %amount
  store i32 %sum, ptr %value.ptr
  ret i32 %sum
}
```

Read that against the MIR at the end of Chapter 19 and the correspondence is
direct: the place projection became `getelementptr`, the binary rvalue became
`add`, the assignment became `store`.

# Chapter 22: Layouts

## The question

`struct Counter { value: int; }` — how many bytes, and what is at which offset?

Layout is where language concepts become memory. It is the backend's first job,
performed before any function body is emitted, because you cannot generate code
that touches a value without knowing its shape.

## `LlvmType`

```rust
// src/backend/mod.rs
enum LlvmType {
    I8, I16, I32, I64, F32, F64, Char16, I1, PtrI8,
    Allocator, Arena, Window,
    TraitObject(String),
    TraitIntersection(Vec<String>),
    Union(Vec<LlvmType>),
    Struct(String),
    Enum(String),
    Reference { target_type: Box<LlvmType>, mutable: bool },
    Pointer { target_type: Box<LlvmType> },
    Function { parameters: Vec<LlvmType>, return_type: Box<LlvmType> },
    Slice { elem_type: Box<LlvmType> },
    Array { elem_type: Box<LlvmType>, len: usize },
    Void,
}
```

And its rendering:

```rust
// src/backend/mod.rs
impl LlvmType {
    fn ir(&self) -> String {
        match self {
            LlvmType::I32 => "i32".to_string(),
            LlvmType::Reference { .. } => "ptr".to_string(),
            LlvmType::Pointer { .. }   => "ptr".to_string(),
            LlvmType::Function { .. }  => "{ ptr, ptr }".to_string(),
            LlvmType::Slice { .. }     => "{ ptr, i32 }".to_string(),
            LlvmType::Union(_)         => "{ i32, ptr }".to_string(),
            LlvmType::Struct(name)     => format!("%struct.{}", sanitize_name(name)),
            LlvmType::Enum(name)       => format!("%enum.{}", sanitize_name(name)),
            LlvmType::Array { elem_type, len } => format!("[{} x {}]", len, elem_type.ir()),
            // ...
        }
    }
}
```

Read the interesting cases as design decisions.

## Structs

```rust
// src/backend/mod.rs
let _ = writeln!(ir, "%struct.{} = type {{ {} }}",
    sanitize_name(&layout.name), field_types);
```

```mermaid
flowchart LR
    subgraph S["%struct.Counter = type { i32 }"]
        F0["<b>value: i32</b><br/>offset 0"]
    end

    subgraph P["struct Point = type { i32, i32 }"]
        P0["<b>x: i32</b><br/>offset 0"]
        P1["<b>y: i32</b><br/>offset 4"]
    end

    style S fill:#E9F8F1,stroke:#40C98A
```

Fields in declaration order. Offsets are LLVM's problem; the backend never
computes one by hand, it emits `getelementptr` with a field index and lets LLVM
apply the target's alignment rules.

## Enums

```rust
// src/backend/mod.rs
for layout in enums.values() {
    let mut field_types = vec!["i32".to_string()];        // the tag
    for variant in &layout.variants {
        for payload_type in &variant.payload_types {
            field_types.push(payload_type.ir());          // every payload, flattened
        }
    }
    let _ = writeln!(ir, "%enum.{} = type {{ {} }}",
        sanitize_name(&layout.name), field_types.join(", "));
}
```

This one deserves attention because it is deliberately naive.

```mermaid
flowchart TD
    subgraph SRC["enum Shape { Circle(int); Rect(int, int); }"]
        X[" "]
    end

    subgraph LAYOUT["%enum.Shape = type { i32, i32, i32, i32 }"]
        T["<b>tag: i32</b><br/>0 = Circle, 1 = Rect"]
        C["<b>Circle payload</b><br/>i32"]
        R1["<b>Rect payload .0</b><br/>i32"]
        R2["<b>Rect payload .1</b><br/>i32"]
    end

    SRC ==> LAYOUT

    style LAYOUT fill:#FFF4E6,stroke:#D9822B
```

A tag followed by **every variant's payload concatenated** — not overlapped. A
real implementation would union the payloads, sizing the enum to its largest
variant. Skunk's version wastes space proportional to the number of variants.

It is simple and correct, and it is an obvious optimisation opportunity if you
are looking for a self-contained backend project.

## Slices

```rust
LlvmType::Slice { .. } => "{ ptr, i32 }".to_string(),
```

A fat pointer: data pointer plus length. This is why `xs.len` is a `Length` node
in HIR rather than a field access — it reads the second word of the pair, not a
struct field.

## Trait objects and vtables

Dynamic dispatch needs runtime type information. Skunk uses the standard vtable
arrangement.

```mermaid
flowchart LR
    subgraph TO["trait object value<br/>%trait.Writer = { ptr, ptr }"]
        D["<b>data</b><br/>→ the Counter"]
        V["<b>vtable</b><br/>→ method table"]
    end

    subgraph VT["@skunk_vtable_Writer_Counter"]
        M0["<b>slot 0</b> → @skunk_Counter_write"]
        M1["<b>slot 1</b> → @skunk_Counter_flush"]
    end

    subgraph OBJ["the Counter"]
        F["value: i32"]
    end

    V --> VT
    D --> OBJ

    style TO fill:#EAF3F7,stroke:#1F6F8B
    style VT fill:#E9F8F1,stroke:#40C98A
```

The vtable is emitted as a constant global:

```rust
// src/backend/mod.rs
globals.push(format!(
    "@{} = private unnamed_addr constant %vtable.{} {{ {} }}",
    vtable_symbol,
    sanitize_name(trait_name),
    entries.join(", ")
));
```

One vtable per (trait, implementing type) pair, named
`skunk_vtable_<Trait>_<Type>`. Method order in the vtable is the trait's
declaration order, and calling through it is a `getelementptr` to the slot, a
`load` of the function pointer, and an indirect `call` — which is exactly what
`calls.rs` emits.

Supertraits are flattened into the layout by `build_typed_trait_layout`, which
also detects cycles in the supertrait graph and reports them rather than
recursing forever.

## Intersections

`T: Writer & Resettable` produces a value satisfying two traits, and needs two
vtables:

```rust
LlvmType::TraitIntersection(traits) => format!(
    "{{ {} }}",
    std::iter::repeat_n("ptr", traits.len() + 1)
        .collect::<Vec<_>>()
        .join(", ")
),
```

`n + 1` pointers: the data pointer plus one vtable per trait. Coercing an
intersection down to one of its traits — narrowing `Writer & Resettable` to
`Writer` — is a projection that picks the data pointer and the right vtable
slot. That is what `coercion.rs` is doing around line 303.

## Closures

```rust
LlvmType::Function { .. } => "{ ptr, ptr }".to_string(),
```

Code pointer plus environment pointer. The environment is a generated struct
`%env.N` holding the captured values, allocated at closure creation and passed as
a hidden first parameter. `closure.rs` emits the `getelementptr` chains that
read captures out of it.

> **⚠ Seam.** All layout tables are keyed by `String`:
> `HashMap<String, StructLayout>`. The front end went to considerable trouble to
> replace names with `TypeId`, and the backend converts back at the boundary.
> This also makes `sanitize_name` — which maps every non-alphanumeric character
> to `_` — a collision risk: `Foo[Bar]` and `Foo_Bar_` produce the same symbol.

# Chapter 23: Code Generation

## Structure

```
src/backend/
├── mod.rs           layouts, signatures, module assembly, the clang driver
├── emitter.rs       low-level IR emission helpers
├── coercion.rs      representation conversions
└── mir_codegen/
    ├── mod.rs       statement dispatch
    ├── value.rs     rvalues and operands
    ├── place.rs     address computation, bounds checks
    ├── calls.rs     static, dynamic, and intrinsic calls
    ├── closure.rs   environments
    ├── intrinsics.rs compiler-provided operations
    └── support.rs   shared helpers
```

The split mirrors MIR's own vocabulary — places, values, calls — which makes
"where does this belong?" usually answerable.

## Module assembly

`mod.rs` writes the module in a fixed order, and the order is forced by LLVM: a
thing must be declared before it is used.

```mermaid
flowchart TD
    A["1 · struct types<br/><code>%struct.Counter = type { i32 }</code>"]
    B["2 · enum types<br/><code>%enum.Shape = type { i32, ... }</code>"]
    C["3 · vtable globals<br/><code>@skunk_vtable_Writer_Counter</code>"]
    D["4 · program globals"]
    E["5 · extra type decls<br/><i>closure environments</i>"]
    F["6 · string constants"]
    G["7 · function bodies"]
    H["8 · <code>define i32 @main()</code>"]

    A --> B --> C --> D --> E --> F --> G --> H

    style H fill:#E9F8F1,stroke:#40C98A
```

The C `main` is emitted last, wrapping the Skunk entry point so the program can
be linked as an ordinary executable.

## The function compiler

```rust
// src/backend/emitter.rs
impl<'a> FunctionCompiler<'a> {
    pub(super) fn new(
        function_name: &'a str,
        return_type: LlvmType,
        dependencies: FunctionCompilerDependencies<'a>,
    ) -> Self {
        Self {
            // ...
            lines: Vec::new(),
            temp_counter: 0,
            label_counter: 0,
        }
    }
}
```

`lines` accumulates the body; `temp_counter` hands out `%0`, `%1`, `%2` — the
SSA requirement from Chapter 21 in practice.

## Places become addresses

A MIR `Place` — base plus projections — becomes a chain of `getelementptr`:

```rust
// src/backend/mir_codegen/place.rs
self.emit_line(format!(
    "{} = getelementptr inbounds {}, ptr {}, i32 0, i32 {}",
    result, aggregate_type, base_ptr, field_index
));
```

Because each MIR `Projection` already records the type after it is applied
(Chapter 18), this loop never has to compute an intermediate type. It walks and
emits.

## Bounds checks

```rust
// src/backend/mir_codegen/place.rs
self.emit_index_bounds_check(&index, &length)?;
```

Every index projection emits a comparison and a conditional branch to a call into
the runtime:

```c
// runtime/skunk_runtime.c
void skunk_panic_index_out_of_bounds(int64_t index, int64_t length) {
    fprintf(stderr, "panic: index %lld out of bounds for length %lld\n",
            (long long)index, (long long)length);
    fflush(stderr);
    abort();
}
```

Note the division of labour: the *check* is generated code, the *reporting* is a
runtime function. Emitting the whole message inline at every index site would
bloat the IR enormously.

## Dynamic dispatch

```rust
// src/backend/mir_codegen/calls.rs
self.emit_line(format!(
    "{} = getelementptr inbounds %vtable.{}, ptr {}, i32 0, i32 {}",
    slot_ptr, trait_name, vtable_ptr, method_index
));
```

Extract the vtable pointer from the trait object, `getelementptr` to the method's
slot, load the function pointer, call it indirectly. Three instructions and no
name lookup — because HIR already decided this was `MethodTarget::Dynamic`.

## Coercions

`coercion.rs` implements the representation changes that MIR marked with
`RvalueKind::Coerce`:

| From | To | What happens |
|---|---|---|
| `i32` | `i64` | `sext` |
| `i32` | `double` | `sitofp` |
| `*Counter` | `Writer` | build `{ data, vtable }` |
| `Writer & Resettable` | `Writer` | project data + one vtable |
| array | slice | build `{ ptr, len }` |

Every one is explicit because the front end marked it. The backend never guesses.

# Chapter 24: Linking and the Runtime

## From IR to executable

```rust
// src/backend/mod.rs
let mut command = Command::new("xcrun");
command.args(["--sdk", "macosx", "clang"]);
// ... or on Linux
Command::new("clang")
```

Skunk writes a `.ll` file and shells out to `clang`, which runs LLVM's optimiser,
generates machine code, and links. The error message when it is missing is
explicit about the dependency:

```rust
// src/backend/mod.rs
"failed to invoke clang while compiling {}: {}. \
 Skunk needs clang installed (macOS: `xcode-select --install`, \
 Linux: install the `clang` package)"
```

## The runtime

Some things cannot reasonably be generated inline. They live in a small C
runtime, compiled and linked alongside your program.

```c
// runtime/skunk_runtime.c — signatures, gathered for reference
void  skunk_panic_index_out_of_bounds(int64_t index, int64_t length);
void  skunk_panic_slice_range_out_of_bounds(int64_t start, int64_t end, int64_t length);

void *skunk_system_allocator(void);
void *skunk_arena_init(void *backing_allocator);
void *skunk_arena_allocator(void *arena_ptr);
void  skunk_arena_reset(void *arena_ptr);
void  skunk_arena_deinit(void *arena_ptr);
void *skunk_alloc_create(void *allocator_ptr, uint64_t size);
void *skunk_alloc_buffer(void *allocator_ptr, uint64_t elem_size, int32_t len);
void  skunk_alloc_destroy(void *allocator_ptr, void *memory);
void  skunk_alloc_free(void *allocator_ptr, void *memory);

void  skunk_test_begin(const char *name);
void  skunk_test_expect(_Bool condition);
int32_t skunk_test_summary(void);
```

Three groups: panics, memory management, and the test harness. There is a second
runtime, `skunk_window_runtime.m`, in Objective-C, providing the macOS window and
input support that `examples/pong.skunk` uses.

## Allocators

Skunk's memory model is explicit — allocation goes through an allocator value:

```skunk
heap: Allocator = System::allocator();
counter: *Counter = Counter::create(heap);
heap.destroy(counter);
```

An `Arena` is a second allocator that frees everything at once:

```c
// runtime/skunk_runtime.c
typedef struct SkunkArenaNode {
    void *memory;
    struct SkunkArenaNode *next;
} SkunkArenaNode;

typedef struct SkunkArena {
    SkunkArenaNode *head;
    SkunkAllocator *allocator;
} SkunkArena;
```

A linked list of allocations plus the backing allocator. `reset` walks the list
and frees each node. This is a genuinely useful pattern for
phase-oriented programs, and it is the reason `Allocator` and `Arena` are
builtin types rather than library types — the backend needs to know their
representation.

## The runtime ships inside the compiler

```rust
// src/backend/mod.rs
// The C runtime sources are embedded into the compiler binary so an installed
// release does not depend on the source tree. They are materialized on demand
// into `$SKUNK_HOME/runtime/<version>/` (default `~/.skunk`).
const RUNTIME_C_SOURCE: &str = include_str!("../../runtime/skunk_runtime.c");
```

`include_str!` bakes the C source into the compiler at build time. On first use
it is written to `~/.skunk/runtime/<version>/` and compiled. Versioning the
directory means several Skunk versions coexist without fighting over runtime
files.

The materialisation is careful about concurrency — native tests run in parallel
and would otherwise race:

```rust
// src/backend/mod.rs
// ... embedded runtime. A process ID alone is therefore not enough to make the
// staging path unique ...
```

Each write gets a sequence number and is renamed into place atomically. This is
the kind of detail that produces flaky tests exactly once and then gets fixed
permanently.

# Chapter 25: Adding a Language Feature

## The worked example

Let us add a **modulo-assign operator**, `%=`, so that `x %= 3;` means
`x = x % 3;`.

It is small enough to hold in your head and large enough to touch the front end,
the semantic layer, and lowering — which is exactly the point.

```mermaid
flowchart TD
    G["<b>1 · grammar.pest</b><br/>parse <code>%=</code>"]
    A["<b>2 · syntax/ast.rs</b><br/>represent it"]
    P["<b>3 · syntax/parser.rs</b><br/>build the node"]
    C["<b>4 · specialization/convert.rs</b><br/>both directions"]
    K["<b>5 · analysis/check.rs</b><br/>type rule"]
    H["<b>6 · hir/lower.rs + validate.rs</b><br/>lower and check"]
    M["<b>7 · mir/lower + validate</b><br/>lower and check"]
    B["<b>8 · backend</b><br/>emit"]
    T["<b>9 · tests</b>"]

    G --> A --> P --> C --> K --> H --> M --> B --> T

    style G fill:#EAF3F7,stroke:#1F6F8B
    style T fill:#E9F8F1,stroke:#40C98A
```

Nine steps. That count is the honest cost of a language feature in Skunk today,
and Chapter 29 discusses why it is higher than it should be.

## The shortcut worth knowing

Before writing any of it: **can this be desugaring?**

`x %= 3` means exactly `x = x % 3`. If the parser produces an ordinary
`Assignment` whose value is a `Binary { left: x, operator: Modulo, right: 3 }`,
then steps 4 through 8 vanish. The checker already types binary modulo. HIR
lowering already handles assignment. The backend already emits `srem`.

You would touch three files instead of nine.

**Always ask whether a new feature can be expressed in terms of existing ones.**
The best language features cost almost nothing downstream. Reach for a new IR
node only when the construct genuinely has no equivalent — because it introduces
control flow, or a new runtime representation, or a type rule that binary
operators cannot express.

Skunk already does this in places: `attach` and `conform` are normalised away in
Chapter 8, so nothing after the front end knows they existed.

For the rest of this chapter, assume `%=` is genuinely new, so we can see the
full path.

## Step 1 — Grammar

```pest
// src/syntax/grammar.pest — sketch, this feature does not exist
mod_assign = { "%=" }
assignment = { access ~ ("=" | mod_assign) ~ (lambda_expr | expression | func_call) }
```

**Watch the ordering.** If `"="` came first in that alternation, `%=` would never
match — the `%` would fail earlier and the whole rule would backtrack oddly.
Ordered choice, from Chapter 6, is unforgiving here.

## Step 2 — AST

```rust
// src/syntax/ast.rs — sketch
pub enum StmtKind {
    // ...
    Assignment { target: Expr, value: Expr },
    CompoundAssignment {
        target: Expr,
        operator: BinaryOperator,
        value: Expr,
    },
}
```

Adding a variant makes every `match` over `StmtKind` fail to compile. That list
of errors *is* your to-do list. Do not add a catch-all arm to make it quiet.

## Step 3 — Parser

```rust
// src/syntax/parser.rs — sketch
Rule::assignment => {
    let target = self.access(pairs.next().unwrap())?;
    let operator = match pairs.peek().map(|p| p.as_rule()) {
        Some(Rule::mod_assign) => { pairs.next(); Some(BinaryOperator::Modulo) }
        _ => None,
    };
    let value = self.expression(pairs.next().unwrap())?;
    let kind = match operator {
        Some(operator) => StmtKind::CompoundAssignment { target, operator, value },
        None => StmtKind::Assignment { target, value },
    };
    Ok(Stmt { id: self.next_id(), span, kind })
}
```

Allocate a `NodeId`, attach a `Span`. Every node, every time.

## Step 4 — The specialization round trip

Both directions of `convert.rs`, and they must stay inverse:

```rust
// src/specialization/convert.rs — sketch, to_tree direction
StmtKind::CompoundAssignment { target, operator, value } => Node::CompoundAssignment {
    target: Box::new(self.expr(target)),
    operator: convert_operator(*operator),
    value: Box::new(self.expr(value)),
},
```

...plus the matching `from_tree` arm and a new `Node` variant in `tree.rs`.

This is the step that makes people sigh, and rightly so — it is pure mechanical
duplication that exists only because of the seam in Chapter 11. If you find
yourself here, you now understand why retiring that tree matters.

## Step 5 — Type rule

In `check.rs`, `resolve_type`:

```rust
Node::CompoundAssignment { target, operator, value } => {
    let target_type = resolve_addressable_access_type(global_scope, symbol_tables, target)?;
    assert_assignment_target_mutable(global_scope, symbol_tables, target)?;
    let value_type = resolve_type(global_scope, symbol_tables, value, Some(&target_type))?;
    let result = resolve_binary(operator, &target_type, &value_type.sk_type)?;
    if !is_assignable(global_scope, &target_type, &result) {
        return Err(format!("cannot assign `{}` to `{}`",
            type_to_string(&result), type_to_string(&target_type)));
    }
    Ok(ResolveResult::new(Type::Void))
}
```

Three checks, and each maps to a real user mistake: the target must be
addressable (`5 %= 3` is nonsense), it must be mutable (`const` bindings), and
the operator must accept the operand types (`"a" %= 1`).

## Step 6 — HIR

If you desugar here, HIR needs nothing new:

```rust
// src/hir/lower.rs — sketch
syntax::StmtKind::CompoundAssignment { target, operator, value } => {
    let target = self.lower_expr(target, None);
    let value = self.lower_expr(value, Some(target.ty));
    let combined = hir::Expr {
        source: statement.id,
        span: statement.span,
        ty: target.ty,
        kind: hir::ExprKind::Binary {
            left: Box::new(self.clone_expr(&target)),
            operator: *operator,
            right: Box::new(value),
        },
    };
    hir::StmtKind::Assignment { target, value: combined }
}
```

**This is the right call**, and it is worth stating the principle: *desugar at the
lowest phase that still has the information you need.* Here HIR has types and
resolved targets, so it can build the `Binary` node correctly — and everything
below HIR stays untouched. Steps 7 and 8 disappear.

The one thing to be careful about is double evaluation. `xs[f()] %= 3` must call
`f()` once. If the target has side effects, lower it to a temporary place first
rather than duplicating the expression — which is exactly the kind of subtlety
MIR's `Place` exists to express.

## Step 9 — Tests

Three levels, and you want all three:

```rust
// unit — the parser produces the right node
#[test]
fn parses_compound_assignment() { /* ... */ }

// unit — the checker rejects bad programs
#[test]
fn rejects_compound_assignment_to_const() {
    let source = r#"
        function main(): void {
            const x: int = 5;
            x %= 3;
        }
    "#;
    assert!(check(&ast::parse(source)).is_err());
}

// integration — it actually runs
#[test]
fn runs_compound_assignment() {
    let stdout = compile_and_run(r#"
        function main(): void {
            x: int = 17;
            x %= 5;
            print(x);
        }
    "#).unwrap();
    assert_eq!(stdout, "2\n");
}
```

The integration test in `src/backend/tests.rs` is the one that proves the feature
works end to end. Do not skip it.

## The checklist

```
□ grammar.pest         — rule added, alternative ordering checked
□ syntax/ast.rs        — node added
□ syntax/parser.rs     — NodeId allocated, Span attached
□ specialization/      — convert.rs BOTH directions, tree.rs variant
□ analysis/check.rs    — type rule
□ hir/                 — lower.rs, validate.rs
□ mir/                 — lower/, validate/          (skip if desugared in HIR)
□ backend/             — emission                    (skip if desugared)
□ tests                — parser, checker, integration
□ cargo test           — green
□ examples/            — still compile
```

# Chapter 26: Debugging Playbook

## The one rule

**Find the earliest representation that is wrong.**

Every bug has a first phase where the data stops matching intent. Everything
after that is a symptom. Debugging generated LLVM for a resolver bug is hours
wasted.

```bash
cargo run -- --debug compile bug.skunk ./bug 2> trace.txt
```

Then walk the stages in order (the table is in Chapter 5) until one looks wrong.
That stage owns the bug.

## Symptom to phase

| Symptom | Look at | Chapter |
|---|---|---|
| Syntax error on valid code | grammar alternative ordering | 6 |
| Parses but groups wrongly | Pratt precedence table | 6 |
| "unknown variable" for a real variable | resolver scopes | 13 |
| Method not found on a type that has it | normalization, or method indexing in HIR lowering | 8, 16 |
| Generic not instantiated | expansion discovery | 11 |
| "type is not concrete" | sealing — expansion missed something | 17 |
| Wrong type inferred for a literal | expected-type threading | 15 |
| Wrong evaluation order | MIR lowering | 19 |
| Wrong field read at runtime | layout or place projection | 22, 23 |
| `clang` rejects the IR | emitter | 23 |
| Segfault | layout mismatch, or a bad coercion | 22 |

## Reading `--debug` output

It is `{:#?}`, so it is verbose. Slice it:

```bash
# stage boundaries
grep -n "skunk debug" trace.txt

# just the HIR
sed -n '/debug 09/,/debug 10/p' trace.txt

# find every mention of a type
grep -n "TypeId(14)" trace.txt | head
```

A useful trick: run the same program with and without your change and `diff` the
traces. The first differing stage localises the change's effect immediately.

## Bisecting by phase

If you cannot tell which stage is wrong, cut the program down instead.

1. Delete half the program. Does the bug survive?
2. Repeat until you have the smallest reproducer.
3. Now the `--debug` output is small enough to read line by line.

Minimising is almost always faster than reading a large trace, and the minimal
case becomes your regression test.

## When LLVM rejects the IR

`clang` reports a line in generated IR. To see it:

```bash
cargo run -- compile bug.skunk ./bug     # writes bug.ll next to the output
```

Read the offending line and work backwards to the emitter that produced that
pattern. Common causes, in rough order of frequency:

- **Type mismatch in an operand** — usually a missing `Coerce` in MIR lowering,
  or a coercion rule that does not handle a case.
- **Using a value before its definition** — SSA violation; a temporary was
  reused.
- **Wrong argument count** — a signature computed differently in two places.
- **Undefined symbol** — name mangling disagreement between declaration and use.

That last one is worth a warning: `sanitize_name` maps every non-alphanumeric
character to `_`, so two different Skunk names can collide into one LLVM symbol.
If a call goes somewhere impossible, check for a mangling collision.

## When a test fails only in parallel

The runtime materialisation described in Chapter 24 had exactly this bug once.
If you see flakiness only under `cargo test` and never with
`--test-threads=1`, look for shared filesystem paths — `~/.skunk/runtime/` is
the usual suspect.

## Assertions as debugging tools

The HIR and MIR validators are debugging instruments, not just gates. If you
suspect a lowering rule is producing malformed output, the validator will
usually tell you precisely what — before the backend turns it into something
inscrutable. Run with `--debug` and watch for validation diagnostics between
stages.

## What exists

266 tests, distributed unevenly:

| Location | Count | Kind |

| `src/analysis/check.rs` | 51 | Type checker, mostly `assert!(..is_err())` |

## Native integration tests

The backbone. Each compiles a whole program and runs it:

```rust
// src/backend/tests.rs
#[test]
fn runs_compiled_trait_bound_program() {
    let stdout = compile_and_run(r#"
        trait Writer    { function write(mut self, value: int): int; }
        trait Resettable { function reset(mut self): void; }

        struct Counter { value: int; }

        conform Writer for Counter {
            function write(mut self, value: int): int {
                self.value = self.value + value;
                return self.value;
            }
        }

        conform Resettable for Counter {
            function reset(mut self): void { self.value = 0; }
        }

        function use_counter[T: Writer & Resettable](counter: *T): int {
            counter.reset();
            return counter.write(41);
        }

        function main(): void {
            heap: Allocator = System::allocator();
            counter: *Counter = Counter::create(heap);
            counter.value = 9;
            print(use_counter(counter));
            heap.destroy(counter);
        }
    "#).unwrap();

    assert_eq!(stdout, "41\n");
}
```

These are slow — each spawns `clang` — but they test the thing that actually
matters: does the program mean what it should? When you change anything in the
middle of the compiler, these are your safety net.

## Where the coverage is thin

Worth knowing before you trust the suite.

**`hir/lower.rs` has 2 tests across 1,514 lines.** It is one of the most
consequential files in the compiler.

**`specialization/convert.rs` has 1 test across 1,729 lines.** Mechanical
translation code is exactly where silent information loss hides.

**The 51 checker tests assert only `.is_err()`.** They confirm a program was
rejected, never *why*. So a test named `test_struct_field_not_exist` passes even
if the program is rejected for a completely unrelated reason.

```rust
// src/analysis/check.rs — the prevailing shape
#[test]
fn test_struct_field_not_exist() {
    let source_code = r#"
        struct Point { x: int; y: int; }
        p: Point = Point { x: 0, y: 0 };
        a = p.z;
    "#;
    let program = ast::parse(source_code);
    assert!(check(&program).is_err());
}
```

The consequence: the checker has 113 error sites and 51 tests that cannot
distinguish between them. If a rule were accidentally deleted, the suite would
very likely stay green.

## How to test well here

**Assert on the specific error, not just failure.** If the checker gains error
codes (Chapter 29), assert on the code. Until then, at minimum assert on a
distinctive substring.

**Test the phase, not the pipeline, when you can.** A unit test on
`mir::lower` that builds HIR directly is faster and localises failure better than
a full compile. `src/mir/tests/` shows the pattern.

**Add an integration test for anything user-visible.** If a Skunk programmer
could notice it, `src/backend/tests.rs` should contain a program that
demonstrates it.

**Keep the examples compiling.** `examples/*.skunk` are a de-facto test suite.
`examples/pong.skunk` is the only exercise of the Window/Color/Keyboard surface;
`examples/c_interop.skunk` is the only exercise of `Memory`, `Bounds`, and
pointer `cast`/`offset` under `unsafe`.

## Language-level tests

Skunk has its own test blocks, run by `skunk test`:

```skunk
test "bump adds to the counter" {
    counter: Counter = Counter::new(41);
    Testing::expect_eq(42, counter.bump(1));
}
```

`src/testing.rs` transforms these into ordinary functions and generates an entry
point that runs them. Notably, the test prelude is *parsed like ordinary source*:

```rust
// src/testing.rs
//! Test declarations are transformed within the canonical syntax AST. The
//! runtime prelude and generated entry point are parsed like ordinary source,
//! so test compilation follows the same front-end path as user programs.
```

Which means the test harness cannot drift from the language — it is built from
it.

# Chapter 28: A Model Extension — The Intrinsic Table

This chapter is a case study. It is the most recent significant change to the
compiler, and it is a template for how the rest of the legacy checker should be
dismantled.

## The problem

`Window::create`, `Memory::copy`, `Color::rgb`, `Keyboard::is_down` and friends
are compiler-provided methods. Until recently, each was validated by hand in
`check.rs`:

```rust
// src/analysis/check.rs — the old shape, ×49
Type::Custom(custom_name) if custom_name == "Window" => {
    if name != "create" {
        return Err(format!("error {}:{}: Window does not support static method `{}`",
            metadata.span.line, metadata.span.start, name));
    }
    if arguments.len() != 3 {
        return Err(format!("error {}:{}: Window::create expects width, height, and title",
            metadata.span.line, metadata.span.start));
    }
    let width = resolve_type(global_scope, symbol_tables, &arguments[0], Some(&Type::Int))?;
    if !is_integral_type(&width.sk_type) {
        return Err(format!("error {}:{}: Window::create width must be an integer",
            metadata.span.line, metadata.span.start));
    }
    // ... height, then title, then the return type
}
```

Forty-nine of these. Roughly 600 lines. Every one is the same rule — *check a
call against a fixed signature* — written out longhand.

The tell was in the error messages themselves. `Window::create width must be an
integer`, `Bounds::check arguments must be integers`, `Color::rgb arguments must
be integers` — the same sentence, forty-nine times, with the nouns changed.

## The fix

Describe the signatures as data:

```rust
// src/intrinsics.rs
pub struct Signature {
    pub receiver: Recv,
    pub name: &'static str,
    pub params: &'static [TyPat],
    pub returns: Ret,
    pub requires_unsafe: bool,
    pub constraint: Option<RecvConstraint>,
}

pub const STATIC_METHODS: &[Signature] = &[
    sig(Recv::Any,      "size_of",   &[],                                    Ret::Int),
    sig(Recv::System,   "allocator", &[],                                    Ret::Allocator),
    sig(Recv::Window,   "create",    &[TyPat::IntLike, TyPat::IntLike, TyPat::Str], Ret::Window),
    sig(Recv::Color,    "rgb",       &[TyPat::IntLike, TyPat::IntLike, TyPat::IntLike], Ret::Color),
    sig(Recv::Keyboard, "is_down",   &[TyPat::Window, TyPat::Char],          Ret::Bool),
    unsafe_sig(Recv::Memory, "copy",
        &[TyPat::PointerLike, TyPat::PointerLike, TyPat::IntLike], Ret::Void),
    // ...
];
```

Forty-nine hand-written checks became thirty declarative rows and one validator.

```mermaid
flowchart LR
    subgraph OLD["Before"]
        O["49 match arms<br/>~600 lines<br/>0 unit tests"]
    end
    subgraph NEW["After"]
        T["30 table rows<br/><code>intrinsics.rs</code>"]
        V["1 validator<br/><code>intrinsic_calls.rs</code>"]
        U["13 unit tests"]
    end
    OLD ==> NEW

    style OLD fill:#FFF4E6,stroke:#D9822B
    style NEW fill:#E9F8F1,stroke:#40C98A
```

## The design decision that matters

`TyPat` binds together two things that must never drift apart: the
*expected-type hint* passed to argument resolution, and the *predicate* the
resolved type must satisfy.

```rust
// src/intrinsics.rs
pub enum TyPat {
    /// Hints `int`; accepts any integral type.
    IntLike,
    /// Hints `byte`; accepts any integral type.
    ByteLike,
    /// Hints `double`; accepts any numeric type.
    NumberLike,
    /// No hint; accepts a pointer or a reference.
    PointerLike,
    /// No hint; requires a pointer specifically, not a reference.
    StrictPointer,
    // ...
}
```

The old code got this pairing right at every site, but *invisibly* — you had to
read both the `Some(&Type::Byte)` hint and the `is_integral_type` check to see
the rule. `Memory::set` hints `byte` but accepts any integral. `draw_rect` hints
`double` but accepts any numeric. `Allocator.destroy` requires a pointer and
rejects a reference, while `Memory::copy` accepts either.

Encoding hint and predicate as one indivisible unit means the two cannot be
changed independently by accident.

## Representation independence

The tables name types in an abstract vocabulary — `IntLike`, `PointerLike` — not
in `tree::Type`. A thin adapter maps the current representation onto it:

```rust
// src/analysis/intrinsic_calls.rs
//! The signatures themselves live in [`crate::intrinsics`] and are described in
//! a representation-independent vocabulary. This module is the adapter that
//! maps the transitional `specialization::tree` type representation onto that
//! vocabulary, and it is the only part that must be rewritten when the checker
//! moves to the `SemanticModel`/HIR path — the tables carry over unchanged.
```

This is the part worth copying. When `check.rs` is retired, the ~200-line adapter
is rewritten and the tables survive untouched. The work is not thrown away.

## Testability

The validator takes its argument resolution through a trait:

```rust
// src/analysis/intrinsic_calls.rs
pub(crate) trait IntrinsicCtx {
    fn resolve(&mut self, node: &Node, hint: Option<&Type>) -> Result<Type, String>;
    fn is_assignable(&self, expected: &Type, actual: &Type) -> bool;
    fn in_unsafe_block(&self) -> bool;
}
```

So it can be unit tested against a stub, with no parser, no scopes, no pipeline:

```rust
#[test]
fn rejects_wrong_argument_type() {
    let signature = intrinsics::static_method(Recv::Keyboard, "is_down").unwrap();
    let error = check_call(
        signature,
        &Type::Custom("Keyboard".to_string()),
        &args(2),
        &mut context(vec![Type::Custom("Window".to_string()), Type::Int]),
    ).unwrap_err();
    assert!(error.contains("argument 2 expects a char"));
}
```

Thirteen such tests, on a surface that previously had zero. This is the general
lesson: **inverting a dependency into a trait is what makes a phase testable in
isolation.** Most of `check.rs` is untestable precisely because it takes a
`GlobalScope` and a `SymbolTables` and calls the 859-line `resolve_type`.

## Preserving behaviour

One subtlety worth studying. The old code had a permissive hole: static calls on
primitives, `Allocator`, and pointers fell through to

```rust
Type::Void => {}
Type::Int  => {}
Type::Allocator => {}
Type::Pointer { .. } => {}
// ...
```

and returned the receiver type — so `int::whatever()` type-checks today.

A strict table rejects that. Correct, but it could break programs that currently
compile. So the wiring deliberately preserves the fall-through:

```rust
// src/analysis/check.rs
// A receiver with no table entry, or a method the receiver does not
// declare, deliberately falls through to the permissive behavior
// below: static calls on primitives, `Allocator`, and pointers
// currently accept any method name and return the receiver type.
// Tightening that is a separate change with its own tests.
```

**Separate a refactoring from a behaviour change.** If both land in one commit
and something breaks, you cannot tell which caused it. This is the single most
useful habit when working in a compiler.

## The result

| Metric | Before | After |
|---|---|---|
| Intrinsic error sites in `check.rs` | 49 | ~4 |
| `check.rs` total lines | 4,204 | 3,847 |
| `resolve_type` lines | 1,248 | 859 |
| Error sites in `check.rs` | 179 | 113 |
| Unit tests on intrinsic validation | 0 | 13 |
| Cost of adding an intrinsic | a match arm + arity + per-arg checks | one table row |

Note that total codebase size *grew* by about 450 lines. Deleting 414 lines of
repetitive logic and adding a table, a validator, and thirteen tests is not a
line-count win. It is a comprehensibility and extensibility win, which is the
one worth having.

# Chapter 29: Known Seams and Where This Is Going

An honest map of the compiler's debt, so you can tell stable ground from
transitional.

## The seams

```mermaid
flowchart TD
    S1["<b>1 · check.rs outside the typed pipeline</b><br/>3,847 lines · string-keyed · no spans<br/><i>Owns most type rules</i>"]
    S2["<b>2 · The specialization round trip</b><br/>convert.rs 1,729 lines<br/><i>A second AST, string-based</i>"]
    S3["<b>3 · Name-keyed backend</b><br/><code>HashMap&lt;String, StructLayout&gt;</code><br/><i>Discards TypeId at the boundary</i>"]
    S4["<b>4 · Two error systems</b><br/>162 <code>Result&lt;_, String&gt;</code> vs 86 Diagnostic"]
    S5["<b>5 · No backend abstraction</b><br/>IR emitted via <code>format!</code><br/><i>No seam for a second target</i>"]

    S2 -->|"causes"| S1
    S1 -->|"causes"| S4
    S3 -->|"causes"| S4

    style S1 fill:#FFF4E6,stroke:#D9822B
    style S2 fill:#FFF4E6,stroke:#D9822B
```

Note the arrows. These are not independent. `check.rs` exists *because* the
specialization tree exists — its whole job is checking that tree. Retiring one
without the other is possible but leaves the harder half in place.

## Seam 1 — the legacy checker

**What.** `src/analysis/check.rs`, 3,847 lines, one 859-line function.
String-keyed symbol tables. Returns `Result<(), String>`.

**Cost.** Type errors — the most common thing a user hits — have no source
locations for roughly two thirds of sites. Type rules are duplicated: `check.rs`
has `resolve_add`, `resolve_cmp`; `hir/lower.rs` has `binary_result`.

**Fix.** Move the rules onto the `SemanticModel`/HIR path.

**Prerequisite.** The 51 existing tests assert only `.is_err()`. Migrating 113
error sites with no test able to distinguish them is how you silently drop a
rule. The test net comes first: error codes on every site, assertions on the
code, then a dual-run harness comparing old and new checkers. `dev-docs/` has the
detailed plan.

## Seam 2 — the specialization round trip

**What.** AST → `tree::Node` → AST, with 1,729 lines of conversion.

**Cost.** Every AST change is duplicated in `convert.rs`. Only 8 of 44 node
variants carry a span. `tree::Span` embeds a full copy of the source text.

**Fix.** Expand generics *after* type analysis, on typed HIR. Then `tree.rs`,
`convert.rs`, and `check.rs` all disappear together — roughly 4,000 lines.

**Why it is not scheduled.** It is a large change to a working compiler, and it
requires generic expansion to reason about `TypeId`s rather than string
substitution — closer to how Rust does it, and substantially more machinery.

## Seam 3 — the name-keyed backend

**What.** All layout tables are `HashMap<String, _>`.

**Cost.** The front end's type safety is discarded at the last boundary.
`sanitize_name` maps non-alphanumerics to `_`, so `Foo[Bar]` and `Foo_Bar_`
collide into one symbol.

**Fix.** Key the backend on `TypeId`. Independent of seams 1 and 2, and lower
risk than either, because the failure mode is a compile error or a test failure
rather than a silently missing rule.

## Seam 4 — two error systems

**What.** 162 `Result<_, String>` sites versus 86 `Diagnostic` sites. The entire
backend is String-only.

**Fix.** Mechanical, once seam 1 is underway. `Diagnostic` is well built and
underused.

## Seam 5 — no backend abstraction

**What.** LLVM IR is produced by `format!` calls scattered through
`emitter.rs` and `mir_codegen/`.

**Cost.** A second target is not reachable without rewriting `backend/`.

**Fix.** An IR-builder abstraction behind `emitter.rs`. **Do seam 3 first** —
designing a backend interface while it still speaks `String` would bake the wrong
vocabulary into the thing you are trying to make swappable.

## Sequencing

```mermaid
flowchart TD
    A["<b>Done</b><br/>Intrinsic signature table<br/><i>Ch 28</i>"]
    B["<b>Next — independent, low risk</b><br/>Seam 3: backend on TypeId<br/>Seam 4: Diagnostic everywhere"]
    C["<b>Then</b><br/>Seam 5: IR-builder abstraction"]
    D["<b>Prerequisite</b><br/>Test net: error codes + dual-run harness"]
    E["<b>The big one</b><br/>Seams 1 + 2 together<br/><i>~4,000 lines deleted</i>"]

    A --> B --> C
    A --> D --> E

    style A fill:#E9F8F1,stroke:#40C98A
    style E fill:#FFF4E6,stroke:#D9822B
```

The backend work (seams 3, 4, 5) is independent of the checker work and carries
much less risk. The checker work needs its safety net built first.

## What this means for you

**Trust:** `ids.rs`, `source_map.rs`, `diagnostic.rs`, `syntax/ast.rs`,
`analysis/types.rs`, `analysis/model.rs`, `hir/`, `mir/`, `intrinsics.rs`. These
are the stable core, and new code should look like them.

**Be careful in:** `analysis/check.rs`, `specialization/`, `backend/`. They work,
they are load-bearing, and they follow older conventions.

**Never do:** add a new phase that consumes `tree::Node`; extend `tree::Span`;
add a new `Result<_, String>` error path; key a new map on a type's name.

# Appendix A: Glossary

**AST** — Abstract Syntax Tree. A tree mirroring the structure of source code.
Skunk's is `syntax::ast::Module`.

**Arena** — An allocator that frees everything at once rather than
per-allocation. A builtin type in Skunk.

**Basic block** — A straight-line statement sequence with one entry and one
terminator. The unit of a control-flow graph.

**Bidirectional checking** — Type checking that propagates an expected type
downward while inferring actual types upward. Skunk threads this as
`expected_type_opt`.

**Bound** — A constraint on a generic parameter, e.g. `T: Writer`.

**CFG** — Control-Flow Graph. Basic blocks as nodes, branches as edges.

**Coercion** — An approved representation change, e.g. `i32` → `i64`, or a
concrete type to a trait object. Explicit in MIR as `RvalueKind::Coerce`.

**DefId** — Identity of a declaration.

**Desugaring** — Expressing a surface construct in terms of simpler existing
ones, so later phases need no new cases.

**Diverging** — An expression that never produces a value. Typed `Never`.

**Fat pointer** — A pointer plus extra data in one value. Skunk slices are
`{ ptr, i32 }`; trait objects are `{ data, vtable }`.

**getelementptr** — The LLVM instruction that computes a field or element address
without loading it.

**HIR** — High-level Intermediate Representation. Resolved and typed, still
source-shaped.

**Interning** — Storing one canonical copy of each distinct value so equality
becomes identity. Skunk interns types in `TypeStore`.

**Intrinsic** — A compiler-provided type or method, e.g. `Window`, `Memory::copy`.

**Lowering** — Converting a higher-level IR to a lower-level one.

**MIR** — Mid-level Intermediate Representation. Explicit control flow, places,
operands.

**Monomorphization** — Generating a separate concrete copy of generic code per
instantiation.

**Normalization** — Collapsing several surface forms into one canonical shape.

**Operand** — A value that can be consumed: a copy from a place, or a constant.

**Place** — An addressable location: a base plus projections.

**Projection** — One step in a place: a field, an index, a dereference.

**Rvalue** — A computation producing a value.

**Sealing** — Verifying that no runtime-facing type still mentions a generic
parameter.

**Shape** — A structural constraint. Any type with matching methods satisfies it,
with no declaration required. Compile-time only.

**Span** — A byte range in a source file.

**SSA** — Static Single Assignment. Every value assigned exactly once. LLVM
requires it; MIR deliberately stops short of it.

**Trait** — A nominal interface requiring an explicit `conform`. Can be used as a
trait object.

**Vtable** — A table of function pointers enabling dynamic dispatch.

# Appendix C: Quick Reference

## The pipeline

```
source → Pest → AST → normalize → load
       → tree → expand → check
       → resolve → model → HIR → validate → seal
       → MIR → validate
       → layouts → LLVM IR → clang → binary
```

## The IDs

| ID | Identifies | Allocated by |
|---|---|---|
| `FileId` | source file | `SourceMap` |
| `NodeId` | syntax node (file ⊕ index) | parser |
| `DefId` | declaration | resolver |
| `LocalId` | local or parameter | resolver |
| `FieldId` | struct field | resolver |
| `VariantId` | enum variant | resolver |
| `TypeId` | semantic type | `TypeStore` (interned) |
| `MirLocalId` | MIR slot | `mir::lower` |
| `MirBlockId` | MIR block | `mir::lower` |

## Which phase owns what

| Question | Phase |
|---|---|
| Does this match the grammar? | parser |
| What node produced this? | AST |
| How are attach/conform unified? | normalization |
| Which imported private name is this? | loader |
| What concrete types does `Box[int]` need? | specialization |
| Which declaration does `Point` name? | resolver |
| What is the full type of `&mut Point`? | model |
| Is this well typed? | check + HIR lowering |
| In what order do subexpressions run? | MIR lowering |
| Is this a local, field, index, or deref? | MIR `Place` |
| How is a trait object laid out? | backend |
| How does out-of-bounds terminate? | backend + runtime |
