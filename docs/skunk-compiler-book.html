# Inside the Skunk Compiler

## An Architecture Guide for New Contributors

---

# Preface

## Who this book is for

You are comfortable in Rust. You can read a `match` over an enum, you know what
`Box<T>` and a lifetime are, and you are not frightened by a trait object.

You have never built a compiler.

That combination is exactly what this book assumes. Every compiler concept —
what an AST is, why anyone would want three of them, what "monomorphization"
means, why a control-flow graph exists — is built from zero. Every Rust idiom is
assumed.

By the end you should be able to open any file in `src/`, know why it exists,
know what it is allowed to assume about its input, and know what the next phase
will assume about its output. That last property is the one that matters. Most
bugs in a compiler are not clever algorithmic mistakes; they are one phase
quietly violating an assumption the next phase depends on.

## What this book is not

It is not a language manual. It will not teach you to *write* Skunk beyond the
small amount needed to read the examples. For that, see the language reference
at <https://dmgcodevil.github.io/skunk/> and the grammar itself in
`src/syntax/grammar.pest`.

It is not a compiler-theory textbook. There is no proof that the type system is
sound, no dragon-book coverage of LR parsing, no register allocation. Skunk
delegates the genuinely hard machine-level problems to LLVM, and this book
follows suit.

## How to read it

The book is arranged in the order data flows through the compiler, which is also
roughly the order of increasing difficulty.

```mermaid
flowchart TD
    P0["<b>Part 0 — Orientation</b><br/>Ch 1–2 · What a compiler is · The Skunk pipeline"]
    P1["<b>Part I — Foundations</b><br/>Ch 3–5 · Identity · Diagnostics · Tooling"]
    P2["<b>Part II — The Front End</b><br/>Ch 6–9 · Grammar · AST · Normalization · Modules"]
    P3["<b>Part III — Generics</b><br/>Ch 10–12 · Monomorphization · The specialization tree"]
    P4["<b>Part IV — Semantics</b><br/>Ch 13–17 · Resolution · Types · Checking · HIR"]
    P5["<b>Part V — The Middle End</b><br/>Ch 18–20 · MIR · Lowering · Validation"]
    P6["<b>Part VI — The Back End</b><br/>Ch 21–24 · LLVM · Layouts · Codegen · Runtime"]
    P7["<b>Part VII — Practice</b><br/>Ch 25–29 · Adding features · Debugging · Testing"]

    P0 --> P1 --> P2 --> P3 --> P4 --> P5 --> P6 --> P7

    style P0 fill:#E9F8F1,stroke:#40C98A
    style P7 fill:#EAF3F7,stroke:#1F6F8B
```

Three reading paths:

**Front to back.** Best if you have the time. Each part assumes the previous one.

**The narrow path.** Chapters 1, 2, 3, 13, 16, 18, and 25. This is the minimum
to understand the shape of the compiler and make a small change safely.

**The bug-fixing path.** Chapter 2 to locate the phase, Chapter 26 for the
debugging playbook, then the chapter covering that phase.

## Conventions

Code quoted from the repository is labelled with its file path. Quotes are
faithful but not always byte-exact: multi-line declarations are sometimes
collapsed onto one line for compactness, and explanatory `//` comments are
occasionally added. `// ...` marks an elision, and `— sketch` marks code that is
*proposed* rather than present in the repository.

> **A note on the traced representations.** Several chapters show what our

You will meet several of these. They are not apologies — they are the honest

# Part 0 — Orientation

---

# Chapter 1: What a Compiler Actually Does

## The problem

You have this text in a file:

```skunk
counter: Counter = Counter::new(41);
print(counter.bump(1));
```

You want a file the CPU can execute. Between those two things sits a very large
gap, and the whole discipline of compiler construction is the art of crossing it
in small, individually-checkable steps.

Why small steps? Because the two ends speak incompatible languages.

Source text is written for humans. It is *ambiguous by design*: the name
`counter` means "whatever `counter` refers to here", and figuring out what that
is requires knowing the surrounding scopes. It is *implicit*: `41` is an integer,
but which width? It is *structured for reading*: `a + b * c` means something
specific about precedence that the characters themselves do not state.

Machine code is written for silicon. Nothing is ambiguous. There are no names,
only addresses and registers. There are no types, only bit widths. There is no
nesting, only jumps.

A compiler is a machine for removing ambiguity, one kind at a time.

## Removing ambiguity in stages

Here is the central idea of this whole book. Each phase of a compiler takes a
representation that is ambiguous in some specific way and produces one that is
not.

```mermaid
flowchart LR
    A["<b>Text</b><br/><i>ambiguous about<br/>structure</i>"]
    B["<b>Tree</b><br/><i>ambiguous about<br/>identity</i>"]
    C["<b>Resolved tree</b><br/><i>ambiguous about<br/>meaning</i>"]
    D["<b>Typed tree</b><br/><i>ambiguous about<br/>order &amp; storage</i>"]
    E["<b>Control-flow graph</b><br/><i>ambiguous about<br/>machine layout</i>"]
    F["<b>Machine code</b><br/><i>unambiguous</i>"]

    A -->|parse| B
    B -->|resolve| C
    C -->|type-check| D
    D -->|lower| E
    E -->|emit| F

    style A fill:#FFF4E6,stroke:#D9822B
    style F fill:#E9F8F1,stroke:#40C98A
```

Read that diagram again, because the entire architecture of Skunk is an
elaboration of it. Every phase you will meet is an arrow on that line, and every
intermediate representation is a box.

Let us make each step concrete using the two lines above.

### Parsing removes structural ambiguity

The text `counter.bump(1)` is a sequence of characters. Is `.` an operator? Is
`bump(1)` a call whose result is then somehow combined with `counter`? A human
reading Skunk knows the answer, but the *characters* do not say.

Parsing produces a tree that commits to one reading:

```mermaid
flowchart TD
    Call["<b>Call</b>"]
    Field["<b>Field access</b><br/>name = bump"]
    Name["<b>Name</b><br/>counter"]
    Lit["<b>Literal</b><br/>1"]

    Call --> Field
    Call --> Lit
    Field --> Name

    style Call fill:#EAF3F7,stroke:#1F6F8B
```

After parsing, structure is settled forever. No later phase re-reads the text to
decide what groups with what.

### Resolution removes ambiguity about identity

The tree says `counter`, but *which* `counter`? A local variable? A global? A
function? If there are two nested scopes both declaring `counter`, which one?

Resolution walks the scopes and answers, replacing every name with a stable
identifier. After resolution, `counter` is no longer a string — it is
`LocalId(3)`, and there is exactly one thing that can be.

This is the phase that makes everything downstream tractable. Once names are
gone, no later phase needs to know what a scope is.

### Type checking removes ambiguity about meaning

Now we know *which* `counter`. But is `counter.bump(1)` even legal? Does
`Counter` have a `bump` method? Does it take one argument? Is that argument
allowed to be an integer? What does the whole expression evaluate to?

Type checking answers all of these and rejects the program if the answers do not
line up. Its output is the same tree with a type attached to every expression.

### Lowering removes ambiguity about order and storage

Consider `f(a) + g(b)`. The typed tree says "add the result of `f(a)` to the
result of `g(b)`". It does *not* say whether `f` runs before `g`. It does not say
where the intermediate results live.

For a language with side effects this matters enormously. So we lower the tree
into a form where evaluation order is explicit, every intermediate value has a
named home, and control flow is jumps rather than nesting.

That form is a **control-flow graph**: a set of straight-line blocks connected by
explicit branches. We will meet Skunk's version, MIR, in Part V.

### Code generation removes ambiguity about the machine

Finally: how many bytes is a `Counter`? Where do its fields sit? What
instruction adds two 32-bit integers? How does a method call actually transfer
control?

Skunk answers the layout questions itself and then hands the instruction
selection and register allocation to LLVM, which is very good at it.

## Why not do it all at once?

You could, in principle, write one enormous function that reads text and writes
machine code. People have. It goes badly for three reasons.

**Testability.** With phases, you can feed a program to the parser and check the
tree. Without them, the only test is "did the whole thing produce the right
binary", and when it does not, you have no idea which of nine concerns broke.

**Reasoning.** Each phase gets to *assume* things. The type checker never worries
about operator precedence, because parsing settled it. Code generation never
worries about which `counter` was meant, because resolution settled it. Every
settled question is one less thing in your head.

**Locality of change.** Adding a new operator touches the grammar and the parser.
It should not require thinking about LLVM. Phases turn a change that could touch
everything into a change that touches three files.

The cost is real: more code, more data structures, more conversions between
them. Skunk has roughly 35,000 lines of Rust for a language you could describe
in an afternoon. That ratio is normal.

## The vocabulary you now own

Four terms will recur constantly. Fix them now.

**Phase** (or *pass*): one step of the pipeline. A function from one
representation to another.

**Intermediate representation** (IR): a data structure holding the program
between phases. Skunk has four — the syntax AST, the specialization tree, HIR,
and MIR — plus LLVM IR at the end.

**Lowering**: converting from a higher-level IR to a lower-level one. "Higher"
means closer to source; "lower" means closer to the machine. You lower HIR to
MIR. You never raise.

**Invariant**: something guaranteed true of an IR. "HIR contains no unresolved
names" is an invariant. Phases are allowed to rely on the invariants of their
input, which is exactly why violating one is so damaging — the violation
surfaces somewhere else entirely.

## Where this lives in code

The whole sequence is written out, in order, in one function:
`check_syntax` in `src/pipeline.rs`. If you ever lose your bearings, read that
function. It is the compiler's table of contents.

```rust
// src/pipeline.rs — abridged
fn check_syntax(
    module: syntax::ast::Module,
    sources: Option<SourceMap>,
    logger: &mut CompilerLogger,
) -> Result<CheckedProgram, String> {
    let module = syntax::normalize::normalize(module)?;
    let initial_resolutions = resolver::resolve(&module)?;
    let expansion_input = convert::to_tree(&module);
    let prepared = expand::prepare_program(&expansion_input)?;
    check::check(&prepared)?;
    let prepared_syntax = convert::from_tree(&prepared, file, source_len)?;
    let prepared_resolutions = resolver::resolve(&prepared_syntax)?;
    let mut semantic_model =
        model::analyze_declarations(&prepared_syntax, prepared_resolutions)?;
    let hir = lower::lower(&prepared_syntax, &mut semantic_model)?;
    validate::validate(&hir, &semantic_model)?;
    let specializations = specialization::seal(&hir, &semantic_model)?;
    Ok(CheckedProgram { hir, semantics: semantic_model, specializations, sources })
}
```

Two things in that listing will look strange, and both are important enough to
flag immediately.

**`resolver::resolve` is called twice.** Once before generic expansion, once
after. Expansion rewrites declarations — `Box[T]` becomes `Box_int` — so the
names in the tree afterwards are not the names that went in. The first
resolution catches errors early against source the user actually wrote; the
second builds the tables the rest of the compiler uses.

**`convert::to_tree` and `convert::from_tree` round-trip the AST.** The syntax
AST is converted into a different tree, expanded, then converted back. Chapter 11
is devoted to why, and to the fact that this is the single largest piece of
architectural debt in the compiler.

## The public boundary

Everything above produces one value:

```rust
// src/pipeline.rs
pub struct CheckedProgram {
    pub hir: crate::hir::Module,
    pub semantics: model::SemanticModel,
    pub specializations: specialization::SpecializationSet,
    pub sources: Option<SourceMap>,
}
```

This is the contract between the front end and everything else. Tests use it.
The backend consumes it. Future tooling — a language server, a formatter — would
start here.

Read the four fields as answers to four questions:

| Field | Answers |
|---|---|
| `hir` | What does the program *do*? |
| `semantics` | What do these IDs and types *mean*? |
| `specializations` | Which concrete instantiations must exist at runtime? |
| `sources` | Where in the original files did this come from? |

`hir` alone is not enough to understand a program. It is full of `TypeId(17)` and
`DefId(4)`, which are meaningless without `semantics` to interpret them. The two
travel together. This pattern — a tree of IDs plus a side table that explains
them — is pervasive, and Chapter 3 explains why it is worth the inconvenience.

## Our running example

One program threads through the entire book. It is deliberately tiny:

```skunk
// counter.skunk
struct Counter {
    value: int;
}

attach Counter {
    function new(start: int): Counter {
        return Counter { value: start };
    }

    function bump(mut self, amount: int): int {
        self.value = self.value + amount;
        return self.value;
    }
}

function main(): void {
    counter: Counter = Counter::new(41);
    print(counter.bump(1));
}
```

It prints `42`.

Small as it is, it exercises a surprising amount of the compiler: a nominal type
with a field, an `attach` block (Skunk's way of adding methods to a type), a
static constructor, a method taking `mut self`, field assignment, arithmetic, a
local declaration, and a call whose result is printed.

Later chapters add a generic `Box[T]` and a `Writer` trait when we need to
discuss monomorphization and dynamic dispatch, but `Counter` is the spine.

## What each phase does to our example

A preview. Do not try to absorb the details — just watch the program get
progressively less like text and more like a machine.

**After parsing** it is a tree of `TopLevel` entries: one `Struct`, one `Attach`
holding two `FunctionDecl`s, one `Function` named `main`.

**After normalization** the `attach` block is gone. Its two methods have been
moved *into* the `StructDecl` as `methods`. Later phases only ever see "a struct
with methods", never "a struct, and separately some methods for it".

**After resolution** every name has an ID. `Counter` is `DefId(0)`, `value` is
`FieldId(0)`, the local `counter` in `main` is `LocalId(0)`.

**After type analysis** every expression carries a `TypeId`. `counter.bump(1)`
is `TypeId` for `int`. The `TypeStore` has interned `Counter` as a nominal type.

**After HIR lowering** the method call is no longer "look up the name `bump`" but
`MethodCall { method: MethodTarget::Definition(DefId(2)), .. }` — the target is
decided.

**After MIR lowering** the body of `main` is basic blocks. The temporary holding
`Counter::new(41)`'s result has its own `MirLocalId`. `self.value + amount`
became a `Binary` rvalue assigned into a temporary.

**After code generation** it is LLVM IR: `%struct.Counter = type { i32 }`, a
function `@skunk_Counter_bump`, and a `main` that calls it and passes the result
to `printf`.

## The debugging consequence

Because each phase has a defined output, you can always ask *where* something
first went wrong. This turns compiler debugging from guesswork into bisection.

```mermaid
flowchart TD
    Q{"Program misbehaves"}
    Q --> P{"Does it parse<br/>to the right tree?"}
    P -->|no| FIX1["Grammar or parser<br/>Ch 6"]
    P -->|yes| R{"Are names bound<br/>to the right things?"}
    R -->|no| FIX2["Resolver<br/>Ch 13"]
    R -->|yes| T{"Are the types right?"}
    T -->|no| FIX3["Checker / model / HIR<br/>Ch 14–16"]
    T -->|yes| M{"Is the MIR<br/>control flow right?"}
    M -->|no| FIX4["MIR lowering<br/>Ch 19"]
    M -->|yes| FIX5["Backend<br/>Ch 22–23"]

    style FIX5 fill:#FFF4E6,stroke:#D9822B
```

The rule that follows: **never debug generated LLVM IR for a name-resolution
bug.** Stop at the earliest representation whose output is wrong. Chapter 5 shows
you how to print each one.

# Part I — Foundations

# Chapter 3: Identity, or Why Everything Is an Integer

## The problem with names

Here is a tempting way to write a compiler. Keep the names. When the type checker
needs to know about `Counter`, look up the string `"Counter"` in a `HashMap`.

Skunk's legacy checker does exactly this, and Chapter 15 is largely a catalogue
of the consequences. The short version:

**Strings are ambiguous.** Two different `Counter` types in two modules are the
same string. Shadowed locals are the same string. A method and a field can share
a name.

**Strings are slow.** Hashing and comparing them, everywhere, forever.

**Strings do not prove anything.** If a function takes a `&str`, the type system
cannot tell you whether it wants a type name, a field name, or a variable name.
Pass the wrong one and you get a runtime lookup failure, not a compile error.

The fix is to replace names with integers as early as possible — and, crucially,
to give each *kind* of thing its own integer type.

## The ID family

```rust
// src/ids.rs
macro_rules! define_id {
    ($name:ident) => {
        #[derive(Clone, Copy, Debug, PartialEq, Eq, PartialOrd, Ord, Hash)]
        pub struct $name(u32);

        impl $name {
            pub const fn new(raw: u32) -> Self { Self(raw) }
            pub const fn index(self) -> usize { self.0 as usize }
        }
    };
}

define_id!(FileId);
define_id!(DefId);
define_id!(LocalId);
define_id!(TypeId);
define_id!(FieldId);
define_id!(VariantId);
define_id!(MirLocalId);
define_id!(MirBlockId);
```

Every one of these is a `u32` at runtime — free to copy, free to compare, free to
hash. But they are *different Rust types*, so passing a `FieldId` where a `DefId`
is expected is a compile error. This is the newtype pattern doing exactly the job
it exists for.

Here is what each one identifies:

| ID | Identifies | Allocated by |
|---|---|---|
| `FileId` | A source file | `SourceMap` |
| `NodeId` | A syntax node | `NodeIdAllocator`, during parsing |
| `DefId` | A declaration — type, function, global, generic parameter | `resolver` |
| `LocalId` | A local variable or parameter binding | `resolver` |
| `FieldId` | A field of a struct | `resolver` |
| `VariantId` | A variant of an enum | `resolver` |
| `TypeId` | A complete semantic type | `TypeStore` |
| `MirLocalId` | A MIR local slot | `mir::lower` |
| `MirBlockId` | A MIR basic block | `mir::lower` |

Learn this table. Almost every function signature in the middle of the compiler
is built from it, and knowing which ID a function takes tells you what phase it
belongs to.

## The side-table pattern

If IDs replace names, where does the information go? Into side tables.

```mermaid
flowchart LR
    subgraph IR["The IR — small and uniform"]
        E["Expr {<br/>&nbsp;&nbsp;ty: TypeId(9)<br/>&nbsp;&nbsp;kind: Field {<br/>&nbsp;&nbsp;&nbsp;&nbsp;field: FieldId(0)<br/>&nbsp;&nbsp;}<br/>}"]
    end

    subgraph MODEL["SemanticModel — the dictionary"]
        FT["field_types<br/>FieldId(0) → TypeId(9)"]
        FO["field_owners<br/>FieldId(0) → DefId(0)"]
        TS["TypeStore<br/>TypeId(9) → Builtin(Int)"]
    end

    E -.->|"look up"| FT
    E -.->|"look up"| FO
    E -.->|"look up"| TS

    style IR fill:#E9F8F1,stroke:#40C98A
    style MODEL fill:#EAF3F7,stroke:#1F6F8B
```

The `SemanticModel` is that dictionary:

```rust
// src/analysis/model.rs
pub struct SemanticModel {
    pub resolutions: Resolutions,
    pub types: TypeStore,
    pub definition_types: HashMap<DefId, TypeId>,
    pub syntax_types: HashMap<NodeId, TypeId>,
    pub local_types: HashMap<LocalId, TypeId>,
    pub field_types: HashMap<FieldId, TypeId>,
    pub field_owners: HashMap<FieldId, DefId>,
    pub variant_payloads: HashMap<VariantId, Vec<TypeId>>,
    pub variant_owners: HashMap<VariantId, DefId>,
}
```

This is why `CheckedProgram` carries `hir` and `semantics` together. The HIR is
the sentence; the `SemanticModel` is the dictionary. Neither is useful alone.

The practical consequence when you are writing compiler code: if you have a
`FieldId` and want to know its type, you do not follow a pointer — you ask the
model. Nearly every function in the semantic layers therefore takes a
`&SemanticModel`.

## `NodeId` and the file-packing trick

`NodeId` is the odd one out. It is a `u64`, not a `u32`:

```rust
// src/ids.rs
pub struct NodeId(u64);

impl NodeId {
    pub const fn in_file(file: FileId, raw: u32) -> Self {
        Self(((file.index() as u64) << 32) | raw as u64)
    }

    pub const fn file(self) -> FileId { FileId::new((self.0 >> 32) as u32) }
    pub const fn local_index(self) -> u32 { self.0 as u32 }
}
```

The high 32 bits are the file, the low 32 bits are the node's index within it.

Why bother? Because parsing is per-file. If node IDs were a single global
counter, every parser would need access to shared mutable state, and parsing two
files in parallel would require a lock. By packing the file into the ID, each
file's parser gets its own private counter starting at zero, and the results
never collide.

This is a small decision that quietly buys future parallelism. There are several
like it in the codebase, and noticing them is a good way to build a feel for the
design.

## `TypeId` and interning

`TypeId` is allocated differently from the others, and the difference matters.

The other IDs are *allocated* — the resolver walks declarations and hands out
`DefId(0)`, `DefId(1)`, and so on. `TypeId`s are *interned*: identical types get
the same ID automatically.

```rust
// src/analysis/types.rs
impl TypeStore {
    pub fn intern(&mut self, kind: TypeKind) -> TypeId {
        if let Some(existing) = self.interned.get(&kind) {
            return *existing;
        }
        let id = TypeId::new(self.kinds.len() as u32);
        self.kinds.push(kind.clone());
        self.interned.insert(kind, id);
        id
    }
}
```

The payoff is that **type equality becomes integer equality**. To ask "are these
two expressions the same type?", compare two `u32`s. No structural walk, no
recursion, no risk of two subtly different comparison functions disagreeing.

This is worth dwelling on, because it is the single most leveraged design
decision in the semantic layer. Consider `Box[Box[int]]`. Structurally comparing
two of those means recursing three levels. Interned, it is one `==`.

The store's own test states the property:

```rust
// src/analysis/types.rs
#[test]
fn interns_equal_types_once_and_separates_instantiations() {
    let mut types = TypeStore::default();
    let int = types.builtin(BuiltinType::Int);
    let string = types.builtin(BuiltinType::String);
    let definition = DefId::new(7);

    let box_int_a = types.nominal(definition, vec![int]);
    let box_int_b = types.nominal(definition, vec![int]);
    let box_string = types.nominal(definition, vec![string]);

    assert_eq!(box_int_a, box_int_b);   // same type, same id
    assert_ne!(box_int_a, box_string);  // different instantiation, different id
}
```

Note the separation in that test: `Box[int]` and `Box[string]` share a `DefId`
(one declaration) but have different `TypeId`s (two types). Keeping declaration
identity and type identity apart is what makes generics expressible at all.

`TypeStore::default()` pre-interns the error type, the never type, all twelve
builtins, and all intrinsic types — so `TypeId(0)` is always `Error` and the
common types get low, stable IDs.

## The error type

`TypeKind::Error` deserves a note. When type checking fails, the checker still
needs to return *something* so it can continue and report more than one error per
run. `Error` is that something: a type that is compatible with everything and
suppresses downstream complaints.

This is why `TypeStore::error()` is hard-coded to `TypeId::new(0)` — it is
interned first, always, so it is available before anything else exists.

# Chapter 4: Source Locations and Diagnostics

## Why locations are hard

An error message without a location is nearly useless:

```
error: type mismatch
```

Versus:

```
counter.skunk:12:18: error: type mismatch
```

The difficulty is that by the time an error is detected, you are ten phases away
from the text. The type checker is looking at `TypeId(9)` and `TypeId(4)`. Where
did they come from? Some expression. Where was that expression written? You need
to have carried that information the whole way.

Skunk carries it as a `Span`.

## `SourceMap` and `Span`

```rust
// src/source_map.rs
pub struct Span {
    pub file: FileId,
    pub start: u32,
    pub end: u32,
}
```

Twelve bytes, `Copy`, no allocation. A span is a byte range in a file, and the
`FileId` says which file.

Notice what it does *not* contain: line and column numbers. Those are computed on
demand by the `SourceMap`, which owns the actual text:

```rust
// src/source_map.rs — usage
if let Some(file) = sources.file(span.file) {
    if let Some(location) = file.line_column(span.start) {
        // location.line, location.column
    }
}
```

This is the right trade. Line and column are needed only when rendering an error
— rare. Byte offsets are needed on every AST node — constant. Storing the cheap
thing and computing the expensive thing lazily is why `Span` can be `Copy`.

> **⚠ Seam.** There is a *second*, incompatible span type in the codebase:
> `specialization::tree::Span`. It stores `start`, `end`, `line`, and — this is
> not a typo — `input: String`, a full copy of the entire source text, on every
> span. Chapter 11 explains how it got there. When you write new code, always use
> `source_map::Span`.

## Diagnostics

```rust
// src/diagnostic.rs
pub struct Diagnostic {
    pub severity: Severity,
    pub code: Option<&'static str>,
    pub message: String,
    pub primary: Option<Box<Label>>,
    pub secondary: Vec<Label>,
    pub notes: Vec<String>,
}
```

A diagnostic has one primary location (where the error is), any number of
secondary locations (related places worth showing), and free-form notes.

It is built with a fluent API:

```rust
Diagnostic::error(format!("duplicate declaration of `{name}`"))
    .with_code("E2001")
    .at(entry.span)
    .label(previous.span, "previous declaration is here")
```

That is real code from `src/analysis/resolver.rs`, and it produces:

```
counter.skunk:12:1: error[E2001]: duplicate declaration of `Counter`
  = counter.skunk:3:1: previous declaration is here
```

The `secondary` label is what makes the message actionable. "Duplicate
declaration" tells you there is a problem; "previous declaration is here" tells
you where to look.

## Structured, not formatted

The important property of `Diagnostic` is that it is **data, not a string**.
Severity, code, and locations are separate fields. Rendering happens once, at the
boundary, in `Diagnostic::render`.

This matters for things that do not exist yet but should: a language server
wants spans as structured ranges, not parsed out of text. A `--json` output mode
wants fields. A test wants to assert on the code without matching on wording.

> **⚠ Seam.** Roughly 162 places in the compiler return `Result<_, String>`
> instead of `Diagnostic` — the entire legacy checker and the entire backend.
> Those errors have no code, no structured span, and in many cases no location at
> all. The machinery in `diagnostic.rs` is good and underused. When you touch one
> of those call sites, converting it is a welcome improvement.

## Rules for new diagnostics

When you add an error to the compiler:

1. **Always attach a span.** An error without `.at(span)` renders without a
   location, and users cannot act on it.
2. **Point at the narrowest thing that is wrong.** For an argument type mismatch,
   span the argument, not the whole call.
3. **Add a secondary label for the other half.** Mismatches have two sides; show
   both.
4. **Use `note` for the fix,** not for restating the problem.
5. **Never format `{:?}` into a user-facing message.** Rust's `Debug` output for
   an internal enum is not something a user of your language should ever see.
   (This rule is currently broken in about fifteen places. Do not add more.)

# Chapter 5: Building, Running, and Seeing Inside

## Getting a compiler

```bash
cargo build
```

Skunk needs `clang` at runtime to link executables — it generates LLVM IR as
text and shells out. On macOS, `xcode-select --install`; on Linux, your
distribution's `clang` package.

## The commands

```bash
# compile to a named binary
cargo run -- compile counter.skunk ./counter && ./counter

# compile and run via a temporary binary
cargo run -- run counter.skunk
cargo run -- counter.skunk          # `run` is the default

# run the language-level test blocks in a file
cargo run -- test counter.skunk
cargo run -- test counter.skunk --filter bump

# build a project using skunk.toml
cargo run -- build
```

## The single most useful flag

```bash
cargo run -- --debug compile counter.skunk ./counter
```

`--debug` prints every intermediate representation to stderr, in order, labelled
and numbered. This is your microscope, and learning to read its output is the
fastest way to build a mental model of the compiler.

The mechanism is deliberately simple:

```rust
// src/pipeline.rs
pub struct CompilerLogger {
    enabled: bool,
    next_stage: usize,
}

impl CompilerLogger {
    pub(crate) fn debug(&mut self, phase: &str, representation: &str, value: &dyn Debug) {
        if !self.enabled { return; }
        eprintln!("\n[skunk debug {:02}] {} ({})", self.next_stage, phase, representation);
        eprintln!("{value:#?}");
        self.next_stage += 1;
    }
}
```

It is `{:#?}` on the actual data structures. That is all. Which means: if you add
a field to an IR node, it shows up in `--debug` for free.

The stages you will see, in order:

| # | Phase | Representation |
|---|---|---|
| 01 | source loading | syntax AST |
| 02 | syntax normalization | syntax AST |
| 03 | pre-expansion name resolution | resolution tables |
| 04 | specialization conversion | generic expansion tree |
| 05 | generic specialization | specialized expansion tree |
| 06 | specialization conversion | specialized syntax AST |
| 07 | post-expansion name resolution | resolution tables |
| 08 | semantic analysis | semantic model |
| 09 | HIR lowering | typed HIR |
| 10 | specialization seal | specialization metadata |
| 11 | MIR lowering | MIR |
| 12 | LLVM lowering | LLVM IR |

Output goes to stderr, so it never contaminates the compiled program's stdout.
That is deliberate — you can debug a program while still piping its output.

A practical habit: pipe it to a file and search.

```bash
cargo run -- --debug compile counter.skunk ./counter 2> trace.txt
grep -n "skunk debug" trace.txt        # the stage index
sed -n '/debug 09/,/debug 10/p' trace.txt   # just the HIR
```

## The test suite

```bash
cargo test                    # everything
cargo test --lib backend      # the backend suite
cargo test intrinsic          # anything matching
```

There are two very different kinds of test in the tree, and knowing which you are
looking at saves confusion.

**Unit tests** live next to the code, test one function, and run fast.
`src/analysis/types.rs` has a good example.

**Native integration tests** live in `src/backend/tests.rs` — 104 of them — and
each one compiles a complete Skunk program to a real binary, runs it, and asserts
on its stdout:

```rust
// src/backend/tests.rs — the shape
let stdout = compile_and_run(r#"
    struct Counter { value: int; }
    // ...
    function main(): void { print(use_counter(counter)); }
"#).unwrap();

assert_eq!(stdout, "41\n");
```

These are slow but they are the real safety net. When you change anything in the
middle of the compiler, these are what tell you the program still means what it
meant.

Chapter 27 covers testing strategy — including where the coverage is thin, which
is worth knowing before you rely on it.

## Reading the codebase without drowning

35,000 lines is a lot to face cold. A suggested order:

```mermaid
flowchart TD
    A["<code>src/pipeline.rs</code><br/>212 lines — the table of contents"]
    B["<code>src/ids.rs</code><br/>81 lines — the vocabulary"]

# Chapter 6: Grammar and Parsing

## Two ways to write a parser

You can write a parser by hand — a function per grammar rule, calling each other
recursively. Or you can write down the grammar declaratively and have a library
generate the parser.

Skunk does both, in sequence, and the reason is worth understanding.

```mermaid
flowchart LR
    TXT["Source text"]
    PEST["<b>Pest</b><br/>generated from<br/><code>grammar.pest</code>"]
    PAIRS["Pest <code>Pairs</code><br/><i>untyped tree</i>"]
    PARSER["<b>parser.rs</b><br/>hand-written<br/>tree walk"]
    AST["<code>syntax::ast::Module</code><br/><i>typed AST</i>"]

    TXT --> PEST --> PAIRS --> PARSER --> AST

    style PEST fill:#EAF3F7,stroke:#1F6F8B
    style AST fill:#E9F8F1,stroke:#40C98A
```

Pest handles the tedious, error-prone part: tokenising, backtracking, operator
sequencing. It produces a generic tree of `Pair`s — every node is "a rule that
matched, with a string slice and some children". That tree is untyped: you
navigate it by calling `.into_inner()` and hoping you know what you will find.

`parser.rs` then walks that generic tree and builds the real, typed AST. This is
where `Pair` becomes `Expr`, where `NodeId`s get allocated, and where spans get
attached.

Keeping the two separate means the grammar file stays readable as a
specification, while the messy work of building a well-typed tree lives in
ordinary Rust you can debug.

## Reading the grammar

`src/syntax/grammar.pest` is 178 lines and is the definitive statement of Skunk's
syntax. Pest uses PEG notation:

| Notation | Meaning |
|---|---|
| `~` | followed by |
| `\|` | ordered choice — first match wins |
| `*` `+` `?` | zero-or-more, one-or-more, optional |
| `@{ }` | atomic — no implicit whitespace inside |
| `_{ }` | silent — matches but produces no tree node |
| `!` | negative lookahead |

The entry point:

```pest
program   = { SOI ~ statement* ~ EOI }
statement = { module | import | export_decl | extern_func_decl | test_decl
            | type_alias_decl | var_decl_stmt | struct_destructure_stmt
            | func_decl | struct_decl | enum_decl | trait_decl | shape_decl
            | attach_decl | conform_decl | control_flow | io | defer_stmt
            | sk_return | unsafe_block | assignment ~ ";" | expression ~ ";" | block }
```

**Ordered choice is the thing to internalise.** In `a | b`, if `a` matches, `b`
is never tried — even if `b` would have matched more text. This is what makes
PEGs unambiguous, and it is also the number one source of grammar bugs. If you
add a rule to `statement` and put it after `expression ~ ";"`, it will never
fire, because most things parse as an expression first.

**Rule of thumb: more specific alternatives go earlier.** Look at how `literal`
is ordered:

```pest
literal = { FLOAT_LITERAL | DOUBLE_LITERAL | LONG_LITERAL | INTEGER
          | STRING_LITERAL | BOOLEAN_LITERAL | CHAR_LITERAL }
```

`FLOAT_LITERAL` is `digits.digits` followed by `f`. `DOUBLE_LITERAL` is
`digits.digits`. `INTEGER` is just `digits`. If `INTEGER` came first, `3.5`
would parse as the integer `3` followed by junk. The ordering is load-bearing.

## Expressions and precedence

Here is something that will surprise you if you have seen other grammars:

```pest
expression = { primary ~ (operation ~ primary)* }
```

That is a *flat* list. `a + b * c` parses to `[a, +, b, *, c]` with no structure.
The grammar does not encode precedence at all.

Precedence is applied afterwards, in `parser.rs`, using a Pratt parser (Pest
provides `PrattParser` for exactly this). This is a common and good design: it
keeps the grammar file simple, and it means changing precedence is a table edit
rather than a grammar restructuring.

If you are adding an operator, you touch two places: the `operation` rule in the
grammar, and the precedence table in `parser.rs`. Forgetting the second gives you
an operator that parses but associates wrongly.

## Types in the grammar

Skunk's type syntax is richer than most, and the grammar shows it:

```pest
pointer_prefix   = { "*" }
reference_prefix = { "&" ~ mut_kw? }
type_prefix      = { pointer_prefix | reference_prefix | "[" ~ expression? ~ "]" }
prefixed_type    = { type_prefix+ ~ const_kw? ~ (base_type | function_type) }

legacy_array_type = { base_type ~ legacy_array_dim+ }   // int[3]
legacy_slice_type = { base_type ~ ("[" ~ "]")+ }        // int[]

intersection_type = { type_atom ~ ("&" ~ type_atom)+ }
union_type        = { union_member ~ ("|" ~ union_member)+ }
_type             = { union_type | intersection_type | type_atom }
```

Two things to notice.

**There are two array syntaxes.** `int[3]` is legacy; `[3]int` is preferred. Both
parse. When you add type-related features, remember both paths exist.

**Union and intersection types are first class.** `Writer & Resettable` is an
intersection — a value satisfying both traits. `int | string` is a union. These
appear all the way down to the backend, where an intersection becomes a fat
pointer with one vtable per trait.

## Access chains

This rule repays careful reading, because it shapes a lot of the compiler:

```pest
member_access  = { "." ~ (func_call | IDENTIFIER) }
deref_access   = { "." ~ "*" }
access_step    = { deref_access | slice_access | array_access | member_access }
chained_access = { (func_call | IDENTIFIER) ~ access_step+ }
access         = { chained_access | IDENTIFIER }
```

An access is a *base* followed by a *sequence of steps*. So `a.b[0].c()` is not
nested — it is `a` plus three steps.

This flat-sequence shape survives into the checker, where `resolve_access` walks
the steps one at a time, carrying the current type forward. It is why so many
error messages talk about "access step", and why `resolve_access` is one of the
larger functions in `check.rs`.

## Adding syntax safely

The checklist, in order:

1. Add the rule to `grammar.pest`, minding alternative ordering.
2. Add the AST node to `syntax/ast.rs`.
3. Handle the new `Pair` in `syntax/parser.rs`, allocating a `NodeId` and
   attaching a `Span`.
4. Follow it through every later phase — the compiler will tell you where,
   because every `match` over the AST is exhaustive.

That last point is the payoff of Rust's exhaustiveness checking. Add a variant to
`ExprKind` and `cargo build` gives you a to-do list of every place that needs to
learn about it. Resist the temptation to add a `_ => {}` arm to silence it; you
are throwing away the compiler's best feature.

# Chapter 7: The Syntax AST

## One shape for a program

`src/syntax/ast.rs` defines what a Skunk program *is*, structurally, before
anything is known about meaning.

```rust
// src/syntax/ast.rs
pub struct Module {
    pub id: NodeId,
    pub span: Span,
    pub name: Option<Path>,
    pub entries: Vec<TopLevel>,
}

pub struct TopLevel {
    pub id: NodeId,
    pub span: Span,
    pub visibility: Visibility,
    pub kind: TopLevelKind,
}
```

Every node follows the same pattern: an identity (`NodeId`), a location (`Span`),
and a `kind` enum carrying the actual content. Once you have seen it three times
you can predict the shape of any node in the file.

```mermaid
classDiagram
    class Module {
        +NodeId id
        +Span span
        +Option~Path~ name
        +Vec~TopLevel~ entries
    }
    class TopLevel {
        +NodeId id
        +Span span
        +Visibility visibility
        +TopLevelKind kind
    }
    class TopLevelKind {
        <<enumeration>>
        Import
        TypeAlias
        Struct
        Enum
        Trait
        Shape
        Attach
        Conformance
        Implementation
        Function
        ExternFunction
        Global
        Test
        Statement
    }
    class StructDecl {
        +Identifier name
        +Vec~GenericParameter~ generic_parameters
        +Vec~StructField~ fields
        +Vec~FunctionDecl~ methods
    }

    Module "1" --> "*" TopLevel
    TopLevel --> TopLevelKind
    TopLevelKind --> StructDecl
```

## Expressions

```rust
// src/syntax/ast.rs
pub struct Expr {
    pub id: NodeId,
    pub span: Span,
    pub kind: ExprKind,
}

pub enum ExprKind {
    Literal(Literal),
    Name(Path),
    Unary { operator: UnaryOperator, operand: Box<Expr> },
    Binary { left: Box<Expr>, operator: BinaryOperator, right: Box<Expr> },
    Call {
        callee: Box<Expr>,
        type_arguments: Vec<TypeSyntax>,
        argument_groups: Vec<Vec<Expr>>,
    },
    Field { receiver: Box<Expr>, name: Identifier },
    Index { receiver: Box<Expr>, coordinates: Vec<Expr> },
    Slice { receiver: Box<Expr>, start: Option<Box<Expr>>, end: Option<Box<Expr>> },
    StructInit { ty: TypeSyntax, fields: Vec<(Identifier, Expr)> },
    StaticCall { ty: TypeSyntax, name: Identifier, arguments: Vec<Expr> },
    Array(Vec<Expr>),
    Lambda(LambdaExpr),
    Block(Block),
}
```

Note `argument_groups: Vec<Vec<Expr>>` rather than `Vec<Expr>`. Skunk allows
`make(1)(2)` — repeated argument groups. Keeping the groups explicit means the
AST records what was written rather than pre-interpreting it as currying. The
comment in the source says exactly this, and it is a good example of an AST's
job: *record the source faithfully, interpret later.*

## `TypeSyntax` is not a type

This is the distinction that trips up newcomers most often.

```rust
// src/syntax/ast.rs
pub struct TypeSyntax {
    pub id: NodeId,
    pub span: Span,
    pub kind: TypeSyntaxKind,
}

pub enum TypeSyntaxKind {
    Builtin(BuiltinType),
    Named { path: Path, arguments: Vec<TypeSyntax> },
    Const(Box<TypeSyntax>),
    Array { element: Box<TypeSyntax>, dimensions: Vec<Expr> },
    Reference { target: Box<TypeSyntax>, mutable: bool },
    Pointer(Box<TypeSyntax>),
    Slice(Box<TypeSyntax>),
    Union(Vec<TypeSyntax>),
    Intersection(Vec<TypeSyntax>),
    Function { parameters: Vec<TypeSyntax>, result: Box<TypeSyntax> },
    SelfType { mutable: bool },
}
```

`TypeSyntax` is *what the user wrote in a type position*. It contains a `Path` —
a name — that has not been resolved to anything. `Named { path: ["Counter"] }`
does not know whether `Counter` exists.

`TypeId` is *a semantic type*. It is interned, it points at a resolved `DefId`,
and it is guaranteed to denote something real.

```mermaid
flowchart LR
    subgraph SYN["Syntax phase"]
        TS["TypeSyntax<br/><code>Named { path: Counter }</code><br/><i>a name, unverified</i>"]
    end
    subgraph SEM["Semantic phase"]
        TI["TypeId(14)<br/><code>Nominal { definition: DefId(0), args: [] }</code><br/><i>a real type</i>"]
    end
    TS -->|"resolver + model"| TI

    style SYN fill:#EAF3F7,stroke:#1F6F8B
    style SEM fill:#E9F8F1,stroke:#40C98A
```

Notice `Array { dimensions: Vec<Expr> }` — array sizes are *expressions* in the
syntax, because `int[N]` might refer to a constant. They become `Vec<u64>` in the
semantic `TypeKind::Array` once evaluated. That is a phase boundary doing its
job.

## The invariant

> **Syntax AST invariant:** nodes contain source names and never contain semantic
> types. No `TypeId`, no `DefId`, no `LocalId`.

This is enforced by construction — `ast.rs` does not import those types. It means
the AST is meaningful without any side tables, which is what makes it a good
input for tooling like formatters that do not want to run the whole compiler.

## Our example as an AST

```text
Module
└── entries
    ├── TopLevel { kind: Struct(StructDecl {
    │       name: "Counter",
    │       generic_parameters: [],
    │       fields: [ StructField { name: "value", ty: Builtin(Int) } ],
    │       methods: []                     ← still empty; see Chapter 8
    │   })}
    ├── TopLevel { kind: Attach(AttachDecl {
    │       target: Named { path: ["Counter"] },
    │       methods: [ FunctionDecl "new", FunctionDecl "bump" ]
    │   })}
    └── TopLevel { kind: Function(FunctionDecl {
            name: "main",
            body: Block { statements: [ Local(..), Print(..) ] }
        })}
```

The `Counter` struct and its methods are *separate top-level entries*. That is
faithful to what the user wrote. Chapter 8 is about why the compiler refuses to
keep it that way.

# Chapter 8: Normalization

## One idea

Skunk lets you write methods in two places:

```skunk
attach Counter {                    // inherent methods
    function new(start: int): Counter { ... }
}

conform Writer for Counter {        // trait implementation
    function write(mut self, v: int): int { ... }
}
```

Both attach behaviour to `Counter`. If every downstream phase had to handle
"methods declared inside the struct", "methods in an `attach`", and "methods in a
`conform`" separately, that is three code paths in the resolver, three in the
checker, three in HIR lowering. Each is an opportunity to handle one case and
forget the others.

Normalization collapses them to one.

```mermaid
flowchart TD
    subgraph BEFORE["Before — three entries"]
        S1["StructDecl Counter<br/>methods: []"]
        A1["AttachDecl → Counter<br/>methods: [new, bump]"]
        C1["ConformanceDecl Writer for Counter<br/>methods: [write]"]
    end

    subgraph AFTER["After — two entries"]
        S2["StructDecl Counter<br/>methods: [new, bump, write]"]
        I2["ImplementationDecl<br/>Writer for Counter<br/><i>no methods — a record</i>"]
    end

    BEFORE ==>|normalize| AFTER

    style BEFORE fill:#FFF4E6,stroke:#D9822B
    style AFTER fill:#E9F8F1,stroke:#40C98A
```

Methods move into the nominal declaration. The `conform` block leaves behind an
`ImplementationDecl` — a *record* that the conformance exists, with no methods.
That record is what the checker consults to answer "does `Counter` implement
`Writer`?", and what the backend uses to decide which vtables to emit.

`AttachDecl` disappears entirely. It carried no information beyond its methods.

## The code

```rust
// src/syntax/normalize.rs
for mut entry in module.entries {
    match &mut entry.kind {
        TopLevelKind::Struct(declaration) => {
            declaration
                .methods
                .extend(methods.remove(&declaration.name).unwrap_or_default());
            output.push(entry);
        }
        TopLevelKind::Enum(declaration) => {
            declaration
                .methods
                .extend(methods.remove(&declaration.name).unwrap_or_default());
            output.push(entry);
        }
        TopLevelKind::Attach(_) => {}                       // dropped
        TopLevelKind::Conformance(declaration) => {
            entry.kind = TopLevelKind::Implementation(ImplementationDecl {
                generic_parameters: std::mem::take(&mut declaration.generic_parameters),
                traits: std::mem::take(&mut declaration.traits),
                target: declaration.target.clone(),
            });
            output.push(entry);
        }
        _ => output.push(entry),
    }
}
```

Straightforward once you know the intent. The `methods` map was built in an
earlier loop, keyed by target type name.

## Validation that happens here

Normalization is also the first phase that rejects programs, and it is a good
place to see the diagnostic style in practice. It checks:

| Check | Code |
|---|---|
| `attach`/`conform` target is a nominal type | `E1100` |
| the target type actually exists | `E1101` |
| `conform` targets a struct specifically | `E1102` |
| `conform` methods declare `self` first | `E1103` |
| no duplicate method name on one type | `E1104` |
| a static attached function does not collide with an enum variant | `E1105` |

These are *source-level* checks — they need no types, only names and shapes.
That is the criterion for belonging in this phase.

There is also a small inference convenience. Writing

```skunk
conform Writer[T] for Box[T] { ... }
```

normally requires declaring `T`. If the target's arguments exactly match the
declaring type's parameters, normalization infers the binder for you.

## The invariant

> **After normalization:** no `Attach` or `Conformance` entries remain. Every
> method lives in the `methods` vector of its owning `Struct` or `Enum`. Trait
> conformance is recorded as `Implementation`.

Every later phase depends on this. If you add a third way to declare methods,
this is where it must be collapsed — not in the resolver, and definitely not in
the backend.

# Chapter 9: Modules, Imports, and Private Names

## The model

Skunk's module system is deliberately simple. One file is one module. `import`
pulls in another file. `export` marks a declaration as visible outside its file.

```skunk
// mylib/math.skunk
module mylib.math;

export function add(a: int, b: int): int { return a + b; }

function helper(x: int): int { return x * 2; }   // private
```

```skunk
// main.skunk
import mylib.math;

function main(): void { print(add(1, 2)); }
```

## Loading

`src/syntax/loader.rs` walks the import graph, parses each file into its own
`Module`, and merges everything into one `Module` that the rest of the compiler
sees.

```mermaid
flowchart TD
    E["main.skunk<br/><i>entry</i>"]
    A["mylib/math.skunk"]
    B["mylib/util.skunk"]
    M["<b>One merged Module</b><br/>all entries, one SourceMap"]

    E -->|import| A
    E -->|import| B
    A -->|import| B

    E --> M
    A --> M
    B --> M

    style M fill:#E9F8F1,stroke:#40C98A
```

Two sets guard the walk:

```rust
// src/syntax/loader.rs
struct ProgramLoader {
    module_root: PathBuf,
    sources: SourceMap,
    visited: HashSet<PathBuf>,     // already merged — skip
    loading: HashSet<PathBuf>,     // on the current path — a cycle
}
```

`visited` makes the diamond above work: `util.skunk` is imported twice but merged
once. `loading` catches import cycles and reports them instead of recursing
forever.

Paths are canonicalised before being used as keys, so `./util.skunk` and
`../mylib/util.skunk` are recognised as the same file.

## Why private names get mangled

Here is the problem. After merging, every declaration from every file sits in one
flat `Vec<TopLevel>`. Two files can each have a private `helper`. In one flat
list, that is a duplicate-declaration error — but the user did nothing wrong.

The loader's answer is to rename private declarations so they cannot collide:

```rust
// src/syntax/loader.rs
fn mangle(module_name: &str, name: &str) -> String {
    // ...
    format!("__{module}_{name}")
}
```

`helper` in `mylib.math` becomes `__mylib_math_helper`. Exported names are left
alone — they are meant to be globally visible, and colliding exports *are* a real
error.

The loader's own test pins the behaviour:

```rust
// src/syntax/loader.rs
#[test]
fn loads_imports_and_mangles_private_names_in_syntax() {
    // ...
    assert!(names.contains(&"__mylib_math_helper"));
}
```

Renaming a declaration is only half the work — every *reference* to it inside the
same module must be renamed too, which is what the bulk of `loader.rs` does.

## Consequences you will notice

**Error messages can show mangled names.** If you see `__mylib_math_helper` in a
diagnostic, that is a private function from `mylib.math`. This is a wart; a
better implementation would keep the original name for display.

**The merged module is flat.** There is no module hierarchy after loading. Later
phases never think about modules at all, which is a real simplification — at the
cost of the mangled names leaking.

> **⚠ Seam.** Name mangling by string rewriting is fragile. A proper fix would
> give each module its own namespace in the resolver, so `DefId`s do the
> disambiguating and names stay pristine. That is a natural companion to the
> `check.rs` retirement discussed in Chapter 29.

# Chapter 10: How Generics Become Machine Code

## The problem

```skunk
struct Box[T] {
    item: T;
}

function unwrap[T](b: Box[T]): T {
    return b.item;
}
```

A CPU has no notion of `T`. It can load 4 bytes or 8 bytes; it cannot load "however
many bytes a `T` happens to be". So `Box[T]` cannot exist at runtime. Something
has to make it concrete.

There are two classic answers.

**Boxing (type erasure).** Represent every `T` as a pointer. One machine-level
`Box` handles all types, because everything is pointer-sized. This is what Java
does. It is compact — one copy of the code — but every value gets heap-allocated
and every access goes through an indirection.

**Monomorphization.** For each concrete type actually used, generate a separate
copy of the code with `T` substituted. `Box[int]` and `Box[string]` become two
distinct structs with two distinct `unwrap` functions. This is what C++ templates
and Rust do. It is fast — no indirection, full inlining — at the cost of code
size.

Skunk monomorphizes.

```mermaid
flowchart TD
    subgraph SRC["What you write"]
        G["<code>struct Box[T] { item: T; }</code><br/><code>function unwrap[T](b: Box[T]): T</code>"]
        U1["<code>Box[int]</code> used in main"]
        U2["<code>Box[string]</code> used in main"]
    end

    subgraph OUT["What the compiler generates"]
        M1["<code>struct Box_int { item: int; }</code><br/><code>function unwrap_int(b: Box_int): int</code>"]
        M2["<code>struct Box_string { item: string; }</code><br/><code>function unwrap_string(b: Box_string): string</code>"]
    end

    G --> M1
    G --> M2
    U1 -.->|drives| M1
    U2 -.->|drives| M2

    style SRC fill:#EAF3F7,stroke:#1F6F8B
    style OUT fill:#E9F8F1,stroke:#40C98A
```

## The three jobs

Monomorphization is really three problems wearing a trenchcoat.

**Discovery.** Which instantiations does the program actually use? You cannot
generate all of them — there are infinitely many. You must walk the program from
its entry points and collect the ones reached. And discovery is recursive: if
`Box[int]` is used, and `Box[T]::get` calls `Wrapper[T]::of`, then
`Wrapper[int]` is now also needed.

**Substitution.** Given `Box[T]` and `T = int`, produce `Box[int]` — rewriting
every occurrence of `T` in fields, parameters, return types, and the bodies of
methods.

**Naming.** The two copies need distinct names, deterministically generated, so
that separate parts of the compiler independently agree on what to call
`Box[int]`.

## When to do it

This is the design decision with the biggest downstream consequences.

**Before type checking** (what Skunk does, and what C++ does): substitute first,
then check the resulting concrete code. Simple to implement — the checker never
sees a type variable. But errors are reported against generated code, which is
why C++ template errors are famously bad, and a generic function with no uses is
never checked at all.

**After type checking** (what Rust does): check the generic code once, abstractly,
proving it correct for *every* `T` satisfying its bounds. Then instantiate. Much
better errors, catches mistakes in unused generics — but the checker must reason
about type variables and bounds, which is substantially more machinery.

Skunk expands before checking, and Chapter 11 covers the machinery — and its
cost.

## Bounds

Substituting blindly is not enough. Consider:

```skunk
function save[T: Writer](w: *T, value: int): int {
    return w.write(value);
}
```

`w.write(value)` is only valid if `T` has a `write` method. The bound `T: Writer`
is the promise that it does, and it does two jobs: it lets the compiler verify
the generic body, and it lets a call site be rejected when the argument does not
qualify.

Skunk's grammar supports three flavours:

```pest
capability_bounds = { ":" ~ trait_bound ~ ("&" ~ trait_bound)* }   // T: Writer & Resettable
lower_type_bound  = { ">:" ~ _type }                               // T >: Base
upper_type_bound  = { "<:" ~ _type }                               // T <: Derived
where_clause      = { "where" ~ where_predicate ~ ("," ~ where_predicate)* }
```

Capability bounds (`T: Writer`) are the common case. The `&` form is an
intersection — `T` must satisfy every listed trait.

## Shapes versus traits

Skunk has a second, subtler mechanism:

```skunk
shape WriterLike {
    function write(mut self, value: int): int;
}
```

A `trait` requires an explicit `conform` declaration. A `shape` is *structural* —
any type with a matching `write` method satisfies `WriterLike`, whether or not
anybody said so.

The runtime consequence is the important part: a trait can be used as a trait
object (`writer: Writer = ...`), which needs a vtable. A shape cannot — it exists
only as a compile-time constraint on generic parameters, and vanishes entirely
after monomorphization. You will see this reflected in MIR, where `Shape` is a
declaration kind carrying signatures but no runtime layout:

```rust
// src/mir/mod.rs
/// Shapes participate in compile-time structural constraints but have no
/// runtime layout. Keeping their signatures here makes MIR self-describing.
Shape { definition: DefId, methods: Vec<TraitMethodDeclaration> },
```

# Chapter 11: The Specialization Tree

> This chapter documents the largest piece of architectural debt in the
> compiler. It is written to be useful rather than diplomatic, because you will
> have to work in this code and you should know what you are walking into.

## What happens

Between the syntax AST and semantic analysis, the program is converted into a
*different* tree, expanded, then converted back.

```mermaid
flowchart LR
    A1["<code>syntax::ast::Module</code><br/><i>NodeId, Span, TypeSyntax</i>"]
    T1["<code>specialization::tree::Node</code><br/><i>strings, structural Type</i>"]
    T2["expanded<br/><code>tree::Node</code>"]
    A2["<code>syntax::ast::Module</code><br/><i>concrete, regenerated</i>"]

    A1 -->|"convert::to_tree<br/>1,729 lines"| T1
    T1 -->|"expand::prepare_program"| T2
    T2 -->|"analysis::check"| T2
    T2 -->|"convert::from_tree"| A2

    style T1 fill:#FFF4E6,stroke:#D9822B
    style T2 fill:#FFF4E6,stroke:#D9822B
```

`src/specialization/convert.rs` implements both directions and is 1,729 lines of
mechanical translation.

## Why it exists

The honest history: `tree::Node` is the compiler's *original* AST. The typed
`syntax::ast` module, the resolver, `SemanticModel`, HIR, and MIR were all built
later, as a better foundation. The specialization machinery — and the type
checker that runs on it — were never migrated.

So the round trip is not a design. It is the boundary between the old compiler
and the new one, and the conversion functions are the airlock between them.

## What the tree looks like

```rust
// src/specialization/tree.rs
pub enum Node {
    Program { statements: Vec<Node> },
    StructDeclaration {
        name: String,
        fields: Vec<(String, Type)>,
        functions: Vec<Node>,
    },
    GenericStructDeclaration {
        name: String,
        generic_params: Vec<String>,
        generic_bounds: HashMap<String, Vec<String>>,
        subtype_bounds: HashMap<String, SubtypeBounds>,
        // ...
    },
    // ... 44 variants total
}
```

Everything is a `String`. Generic parameters are strings, bounds are maps from
string to string. This is exactly the design Chapter 3 argued against — and it is
why substitution here is string rewriting rather than ID remapping.

## Two problems you must know about

### Only 8 of 44 variants carry a location

```rust
// src/specialization/tree.rs
pub struct Metadata {
    pub span: Span,
}
```

Grep for `metadata: Metadata` in `tree.rs` and you get eight hits, out of 44
`Node` variants.

The consequence is visible in error messages. Where a node happens to carry
metadata, the checker formats a location into the message by hand:

```rust
// src/analysis/check.rs
Err(format!(
    "error {}:{}: Window::create expects width, height, and title",
    metadata.span.line, metadata.span.start
))
```

Where it does not — roughly two thirds of error sites — there is simply no
location available at any price. This is the root cause of Skunk's weakest
diagnostics.

### `Span` contains a copy of the source

```rust
// src/specialization/tree.rs
pub struct Span {
    pub start: usize,
    pub end: usize,
    pub line: usize,
    pub input: String,   // the entire source text — per span
}
```

Every span carries a full copy of the file it came from. This is a significant
contributor to the compiler's memory use and to its 611 `.clone()` calls.

**Do not extend this type.** If you need to add location information anywhere,
use `source_map::Span` — twelve bytes, `Copy`, and what `Diagnostic` already
consumes.

## Expansion

`src/specialization/expand/` is where the actual work happens.

```rust
// src/specialization/expand/mod.rs
fn prepare(&mut self) -> Result<Node, String> {
    self.validate_traits()?;
    self.validate_impls()?;
    let mut output = Vec::<Node>::new();
    output.extend(self.root_traits.clone());
    output.extend(self.root_concrete_impls.clone());
    for statement in self.root_statements.clone() {
        // transform each declaration, discovering instantiations as it goes
    }
    // ...
}
```

The expander holds indexes of generic templates (`concrete_structs`,
`concrete_enums`, generated-node tables) and a set of "stacks" —
`function_stack`, `struct_stack`, `enum_stack`, `trait_stack` — which guard
against infinite recursion when a generic instantiates itself.

**Determinism matters enormously here.** The order in which specializations are
emitted must be stable, because it determines generated names, which determine
LLVM symbol names. A `HashMap` iteration order leaking into that pipeline would
make builds non-reproducible. The `GeneratedNodes` tables exist to keep emission
ordered.

## Working in this code

Practical advice:

- **Change `convert.rs` in both directions at once.** `to_tree` and `from_tree`
  must stay inverse. A field added to one and not the other loses information
  silently.
- **Use `--debug` stages 04, 05, and 06.** They show the tree going in, the
  expanded tree, and the AST coming back out. Diffing 04 against 06 for a
  non-generic program is a good sanity check — it should round-trip cleanly.
- **Expect no spans.** When you add an error here, it will probably have no
  location. Write the message so it is still actionable.
- **Do not add features here if you can avoid it.** Anything expressible after
  the semantic boundary belongs there instead.

## Where it is going

The intended future is to expand generics *after* type analysis, on typed HIR.
Then `tree.rs`, `convert.rs`, and the legacy checker all disappear together —
roughly 4,000 lines — and generics become an operation on well-typed data
instead of a string rewrite.

That is a large change and it is not scheduled. Chapter 29 lays out the
sequencing.

# Chapter 12: Inference and Substitution

## Inferring type arguments

You can write the arguments explicitly:

```skunk
print(unwrap(Option[int]::None()));
```

But usually you do not have to:

```skunk
counter: Counter = Counter::new(41);
print(save(console, 4));            // T inferred from `console`
```

Inference in Skunk is *unification against the expected shape*. Given a call to
`save[T](writer: *T, value: int)` with an argument of type `*ConsoleWriter`, the
expander matches the parameter pattern `*T` against `*ConsoleWriter`, binds
`T = ConsoleWriter`, and proceeds.

This is deliberately much weaker than Hindley–Milner. It is local — one call at a
time, no constraint set propagated across statements. When the arguments do not
determine a parameter, you must annotate:

```skunk
explicit: Result[int, AppError] = Result[int, AppError]::Ok(7);
```

`Result::Ok(7)` cannot infer `E` from `7` alone, so the annotation is required.

## Contextual inference for enum constructors

There is one place inference reaches backwards from the expected type:

```skunk
function success(value: int): Result[int, AppError] {
    return Result::Ok(value);        // E inferred from the return type
}
```

The expected type of a `return` is the function's declared result, so
`Result::Ok(value)` can take `[int, AppError]` from context. This applies to
returns, typed initialisers, assignments, struct fields, array elements, and
arguments to concrete functions.

## Substitution

Once bindings are known, substitution walks the template and replaces parameters.
Because the specialization tree is string-based, this is a rewrite of names and
`Type` values:

```text
GenericStructDeclaration                StructDeclaration
  name: "Box"                             name: "Box_int"
  generic_params: ["T"]          ──►      fields: [("item", Int)]
  fields: [("item", Custom("T"))]         functions: [ ...substituted... ]
```

Method bodies are substituted too — every `T` in a parameter, local declaration,
static call, or struct initialiser inside `Box[T]`'s methods becomes `int`.

## Bound checking

Before substituting, the expander verifies the argument satisfies the bounds:

```skunk
function save[T: WriterLike](writer: *T, value: int): int { ... }
```

Calling `save` with a type lacking a `write` method must fail *here*, with a
message about the bound — not later, with a confusing error inside generated
code. This is the main defence against C++-style template error messages, and it
is why `validate_traits` and `validate_impls` run at the start of `prepare`.

Supertraits are collected transitively, so `trait Writer: Readable` means
satisfying `Writer` also satisfies `Readable`. Cycles in that graph are detected
and reported rather than hanging.

## The output contract

After expansion the program contains **no generic declarations at all**. Every
struct, enum, trait, and function is concrete. That is what allows
`analysis::check` and everything after it to ignore type variables completely.

The contract is verified much later, at the end of the semantic phase, by
`specialization::seal` — Chapter 17. Sealing walks the finished HIR and proves
that no runtime-facing type still mentions a generic parameter. If expansion
missed something, that is where it is caught, with a real span attached.

# Chapter 13: Name Resolution

## The job

Resolution answers one question, everywhere: **what does this name refer to?**

It does not answer "is this well typed". Those are genuinely separate problems,
and keeping them apart is what lets both stay comprehensible. Resolution is
purely lexical — it needs to know about scopes, not about types.

```rust
// src/analysis/resolver.rs
//! Name resolution and lexical scope construction.
//!
//! Resolution assigns stable identities without performing type checking. It
//! is the only phase that turns source-level names into `DefId`/`LocalId`.
```

"The only phase" is the important clause. If you find yourself doing a name
lookup somewhere else in the compiler, you are almost certainly doing something
wrong.

## Two namespaces

Skunk keeps types and values in separate namespaces:

```rust
// src/analysis/resolver.rs
struct Resolver {
    resolutions: Resolutions,
    value_definitions: HashMap<String, DefId>,
    type_definitions: HashMap<String, DefId>,
    value_scopes: Vec<HashMap<String, LocalId>>,
    type_scopes: Vec<HashMap<String, DefId>>,
    diagnostics: Vec<Diagnostic>,
}
```

So a struct `Counter` and a function `Counter` can coexist — the compiler always
knows from context which namespace it is looking in. A type annotation looks in
the type namespace; an expression looks in the value namespace.

The `Vec<HashMap<...>>` is a scope stack. Entering a block pushes; leaving pops.
Lookup walks from the innermost frame outwards, which is what gives you shadowing
for free.

```mermaid
flowchart TD
    subgraph STACK["value_scopes — innermost last"]
        S0["global<br/>counter → DefId(5)"]
        S1["fn main<br/>counter → LocalId(0)"]
        S2["inner block<br/>amount → LocalId(1)"]
    end

    Q["lookup 'counter'"] --> S2
    S2 -->|"miss"| S1
    S1 -->|"hit → LocalId(0)"| R["ValueResolution::Local(LocalId(0))"]

    style R fill:#E9F8F1,stroke:#40C98A
```

## Two passes

```rust
// src/analysis/resolver.rs
pub fn resolve(module: &Module) -> Result<Resolutions, Vec<Diagnostic>> {
    let mut resolver = Resolver::default();
    resolver.collect_top_level(module);
    resolver.resolve_module(module);
    // ...
}
```

`collect_top_level` runs first and registers every top-level declaration. Only
then does `resolve_module` walk bodies.

This ordering is what makes forward references work. `main` can call a function
declared below it, because by the time bodies are resolved, every top-level name
is already known. Without the split, declaration order would matter — a
C-style requirement that nobody enjoys.

## The output

```rust
// src/analysis/resolver.rs
pub struct Resolutions {
    pub definitions: Vec<Definition>,
    pub locals: Vec<LocalDefinition>,
    pub item_definitions: HashMap<NodeId, DefId>,
    pub function_definitions: HashMap<NodeId, DefId>,
    pub generic_definitions: HashMap<NodeId, DefId>,
    pub field_definitions: HashMap<NodeId, FieldId>,
    pub variant_definitions: HashMap<NodeId, VariantId>,
    pub supertrait_definitions: HashMap<NodeId, Vec<DefId>>,
    pub local_bindings: HashMap<NodeId, Vec<LocalId>>,
    pub values: HashMap<NodeId, ValueResolution>,
    pub types: HashMap<NodeId, TypeResolution>,
}
```

Read this as two groups.

**`definitions` and `locals` are the arrays.** `DefId(n)` indexes into
`definitions`; `LocalId(n)` indexes into `locals`. This is why the IDs have an
`index()` method — they are array subscripts.

**Everything else maps `NodeId` → resolution.** For any syntax node, you can ask
what it resolved to. `values` handles expression positions; `types` handles type
positions.

The two resolution enums are worth memorising:

```rust
pub enum ValueResolution {
    Definition(DefId),   // a function, global, or similar
    Local(LocalId),      // a parameter or local variable
}

pub enum TypeResolution {
    Definition(DefId),        // struct, enum, trait, alias
    GenericParameter(DefId),  // T in Box[T]
    Builtin(BuiltinType),     // int, string, ...
    Intrinsic(IntrinsicType), // Window, Memory, ...
    SelfType,                 // Self
}
```

Note that generic parameters get `DefId`s too. `T` is a declaration — it has a
scope and can be referred to — even though it disappears after expansion.

## Errors from this phase

Resolution reports the errors that need no types:

- a name that does not exist
- a duplicate declaration
- a use before declaration in a local scope

The duplicate-declaration diagnostic is the one quoted in Chapter 4, and it is a
good model to copy:

```rust
Diagnostic::error(format!("duplicate declaration of `{name}`"))
    .with_code("E2001")
    .at(entry.span)
    .label(previous.span, "previous declaration is here")
```

There is one deliberate exception: repeated `extern` declarations are allowed,
because C headers get included more than once. Signature compatibility is left as
a semantic concern.

# Chapter 14: Building the Semantic Model

## From names to types

The resolver produced identities. `analysis::model` turns those identities into
*types*.

```rust
// src/analysis/model.rs
pub fn analyze_declarations(
    module: &Module,
    resolutions: Resolutions,
) -> Result<SemanticModel, Vec<Diagnostic>> {
    let mut analyzer = Analyzer { /* ... */ };
    analyzer.collect_nominal_types();
    analyzer.collect_aliases();
    analyzer.collect_signatures_and_bindings();
    // ...
}
```

Three passes, and the order is forced by the dependencies between them.

```mermaid
flowchart TD
    A["<b>1. collect_nominal_types</b><br/>Every struct/enum/trait gets a TypeId.<br/><i>Bodies not yet examined.</i>"]
    B["<b>2. collect_aliases</b><br/>Resolve <code>type Foo = Bar</code>.<br/><i>Needs step 1 for targets.</i>"]
    C["<b>3. collect_signatures_and_bindings</b><br/>Field types, parameter types,<br/>return types, local types.<br/><i>Needs 1 and 2.</i>"]

    A --> B --> C

    style A fill:#EAF3F7,stroke:#1F6F8B
    style C fill:#E9F8F1,stroke:#40C98A
```

Why can't it be one pass? Because of mutual reference:

```skunk
struct Node {
    next: *Node;          // needs Node's TypeId while defining Node
}
```

By registering all nominal *identities* before looking at any field, the second
reference resolves fine. This two-phase shape — declare everything, then fill in
bodies — recurs throughout compiler construction.

## `TypeKind`

```rust
// src/analysis/types.rs
pub enum TypeKind {
    Error,
    Never,
    Builtin(BuiltinType),
    Intrinsic(IntrinsicType),
    GenericParameter(DefId),
    Nominal { definition: DefId, arguments: Vec<TypeId> },
    Const(TypeId),
    Array { element: TypeId, dimensions: Vec<u64> },
    Reference { target: TypeId, mutable: bool },
    Pointer(TypeId),
    Slice(TypeId),
    Union(Vec<TypeId>),
    Intersection(Vec<TypeId>),
    Function { parameters: Vec<TypeId>, result: TypeId },
}
```

Compare this against `TypeSyntaxKind` from Chapter 7. They look similar, and the
differences are exactly the work this phase does:

| `TypeSyntaxKind` | `TypeKind` | What changed |
|---|---|---|
| `Named { path, arguments }` | `Nominal { definition: DefId, arguments: Vec<TypeId> }` | Name → resolved declaration |
| `Array { dimensions: Vec<Expr> }` | `Array { dimensions: Vec<u64> }` | Expression → evaluated constant |
| `SelfType { mutable }` | *(resolved to the owner)* | `Self` → the actual type |
| *(no equivalent)* | `Error`, `Never` | Compiler-internal types |

Every recursive position also changed from `Box<TypeSyntax>` to `TypeId`. That is
interning: a type is a flat integer, not a tree.

## `Never` and divergence

`TypeKind::Never` is the type of an expression that does not produce a value —
one that always returns, panics, or loops forever.

It matters because of code like this:

```skunk
function f(x: int): int {
    if (x > 0) { return 1; }
    return 0;
}
```

The `if` branch does not fall through. Something has to represent "control does
not continue here", and `Never` is it. Being a subtype of everything, it can
appear wherever a value is expected without complaint.

HIR has a related concept at statement level:

```rust
// src/hir/mod.rs
pub enum Flow {
    FallsThrough,
    Returns,
    Diverges,
}
```

Every `Block`, `If`, `Match`, and `For` carries a `Flow`. This is what makes
"missing return statement" checkable, and what tells MIR lowering whether to emit
a fall-through edge after a construct.

# Chapter 15: The Legacy Type Checker

> **⚠ Seam.** This chapter documents `src/analysis/check.rs` — 3,847 lines,
> containing one 859-line function. It is the oldest surviving component and the
> one scheduled for retirement. You need to understand it because it currently
> owns most of Skunk's type rules.

## What it does

`check.rs` type-checks the *expanded specialization tree* — after
monomorphization, before the semantic model is built.

```rust
// src/analysis/check.rs
/// Type-checks a fully loaded and monomorphized program.
///
/// Successful completion means the program is semantically valid enough for the
/// LLVM backend to consume.
pub fn check(node: &Node) -> Result<(), String> {
    let mut var_tables = SymbolTables::new();
    var_tables.add(SymbolTable::new());
    let mut global_scope = GlobalScope::new();
    let Node::Program { statements } = node else {
        return Err("type-checking input must have a program root".to_string());
    };
    for statement in statements {
        global_scope.add(statement);
    }
    match resolve_type(&global_scope, &mut var_tables, node, None) {
        Err(e) => Err(e.to_string()),
        Ok(_) => Ok(()),
    }
}
```

Note the return type: `Result<(), String>`. No `Diagnostic`, no code, no span.

## How it is built

Two structures do the work.

**`GlobalScope`** indexes top-level declarations by name — structs, enums,
traits, functions, globals. Built once at the start.

**`SymbolTables`** is a stack of `SymbolTable`, each a name → `Symbol` map. It
also tracks unsafe-block nesting:

```rust
// src/analysis/check.rs
impl SymbolTables {
    fn enter_unsafe(&mut self) { /* ... */ }
    fn exit_unsafe(&mut self) { /* ... */ }
    fn is_unsafe(&self) -> bool { /* ... */ }
}
```

Everything is keyed by `String`. This is the design Chapter 3 argued against, and
here you can see the consequences directly: a `SymbolTable` cannot distinguish
two same-named things from different scopes except by stack position, and nothing
in the type system prevents passing a field name where a type name is wanted.

## `resolve_type`

One function does the bulk of the work. It is 859 lines and is a single `match`
over `Node`:

```rust
// src/analysis/check.rs
fn resolve_type(
    global_scope: &GlobalScope,
    symbol_tables: &mut SymbolTables,
    node: &Node,
    expected_type_opt: Option<&Type>,
) -> Result<ResolveResult, String> {
    match node {
        Node::Program { statements } => { /* ... */ }
        Node::StructInitialization { _type, .. } => { /* ... */ }
        // ... every node variant
    }
}
```

The `expected_type_opt` parameter is how bidirectional checking is threaded
through. When checking `x: byte = 1`, the expected type `byte` is passed down so
the literal `1` can be given the right width rather than defaulting to `int`.
This is a genuinely good idea implemented in an awkward place.

`ResolveResult` carries the type plus a `returned` flag used for reachability:

```rust
// src/analysis/check.rs
struct ResolveResult {
    sk_type: Type,
    returned: bool,
}
```

## Access resolution

The second-largest function, `resolve_access`, handles chains like
`a.b[0].c()`. Remember from Chapter 6 that an access is a base plus a flat
sequence of steps. `resolve_access` walks them, carrying the current type:

```mermaid
flowchart LR
    B["base: <code>counter</code><br/>type = Counter"]
    S1["step: <code>.value</code><br/>type = int"]
    S2["step: <code>+ 1</code>"]

    B -->|"field lookup on Counter"| S1 --> S2

    style B fill:#EAF3F7,stroke:#1F6F8B
```

At each step it must handle every possible receiver: struct, enum, trait object,
intersection, array, slice, pointer, reference, `Allocator`, `Arena`, `Window`.
That breadth is why the function is large, and why "unsupported access step" is a
recurring error message.

## What was recently fixed here

Until recently, this file also contained 49 hand-written intrinsic method checks
— every one of `Window::create expects width, height, and title`,
`Memory::copy expects dst, src, and byte count`, and so on, spelled out
individually with its own arity check and per-argument type test.

They have been replaced by a declarative table. Chapter 28 covers the design in
detail, because it is a good model for how the rest of this file should be
dismantled. The result: 414 lines deleted, error sites down from 179 to 113,
`resolve_type` down from 1,248 lines to 859.

## Working in this file

- **`--debug` stage 05** shows the tree it is checking. Start there.
- **Errors have no spans.** Write messages that identify the construct by name,
  since you cannot point at it.
- **Do not add rules here if you can avoid it.** New checks that can be expressed
  on HIR belong in `hir/validate.rs` or in the model, where they get spans for
  free.
- **The permissive fall-through is deliberate.** Static calls on primitives,
  `Allocator`, and pointers currently accept *any* method name and return the
  receiver type. This is a known hole, preserved intentionally so that tightening
  it can be a separate, testable change.
